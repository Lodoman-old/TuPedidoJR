[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tupedidojr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.6",
    "shapely>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "email-validator>=2.0.0",
    "mercadopago>=2.4.0",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
    "staticmap>=0.3.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]
mobile = [
    "flet>=0.26.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
