{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4>Recuperar contraseña</h4>
      <p class="text-muted small">Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
      <div id="forgotMsg" class="alert d-none"></div>
      <form id="forgotForm">
        <input id="forgotEmail" type="email" class="form-control mb-3" placeholder="Correo electrónico" required>
        <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
      </form>
      <div class="text-center mt-3 small"><a href="/web/login">Volver a iniciar sesión</a></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('forgotMsg');
    msg.className = 'alert d-none';
    try {
      const res = await apiRequest('POST', '/auth/forgot-password', {
        email: document.getElementById('forgotEmail').value.trim(),
      });
      msg.className = 'alert alert-success';
      msg.textContent = res.message;
    } catch (ex) {
      msg.className = 'alert alert-danger';
      msg.textContent = ex.message;
    }
  });
</script>
{% endblock %}
