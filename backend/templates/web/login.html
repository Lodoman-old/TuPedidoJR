{% extends "base.html" %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4">
      <div class="text-center mb-4">
        <img src="/static/logo.png" height="60" alt="TuPedidoJR">
        <h4 class="mt-2">Iniciar sesión</h4>
      </div>
      <div id="loginError" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <div class="text-center mt-3 small d-flex flex-column gap-1">
        <a href="/web/register" id="registerLink">¿No tienes cuenta? Regístrate</a>
        <a href="/web/forgot-password">Olvidé mi contraseña</a>
        <a href="/web/register-restaurant">Registrar mi restaurante</a>
      </div>
      <div class="text-center mt-2">
        <a href="/web/app" class="small"><i class="bi bi-phone"></i> Descargar la app / instalar en iPhone</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('d-none');
    try {
      await login(email, password);
      if (safeNext) {
        window.location.href = safeNext;
        return;
      }
      try {
        await getDeliveryProfile();
        window.location.href = '/web/delivery';
      } catch (e) {
        window.location.href = '/web/restaurants';
      }
    } catch (ex) {
      errEl.textContent = ex.message;
      errEl.classList.remove('d-none');
    }
  });

  const nextParam = new URLSearchParams(window.location.search).get('next');
  const safeNext = nextParam && nextParam.startsWith('/web/') && !nextParam.startsWith('/web/login')
    ? nextParam
    : null;
  if (safeNext) {
    const registerLink = document.getElementById('registerLink');
    if (registerLink) registerLink.href = `/web/register?next=${encodeURIComponent(safeNext)}`;
  }
</script>
{% endblock %}
