{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
  <h4 class="mb-3">📦 Mandados</h4>
  <p class="text-muted mb-4">Solicita que un repartidor vaya por tus compras a cualquier tienda</p>
  <div class="row justify-content-center g-3">
    <div class="col-6 col-md-4">
      <a href="/web/mandados/new" class="btn btn-primary btn-lg w-100">
        <i class="bi bi-plus-circle"></i> Nuevo mandado
      </a>
    </div>
    <div class="col-6 col-md-4">
      <a href="/web/mandados/list" class="btn btn-outline-primary btn-lg w-100">
        <i class="bi bi-list-check"></i> Mis mandados
      </a>
    </div>
    <div class="col-12 col-md-4">
      <a href="/web/store-requests" class="btn btn-outline-dark btn-lg w-100">
        <i class="bi bi-chat-square-text"></i> Mis solicitudes
      </a>
    </div>
  </div>
  <div class="alert alert-light border mt-4 d-flex align-items-center gap-2 text-start">
    <i class="bi bi-phone fs-4 text-primary"></i>
    <div class="flex-grow-1">
      <strong>Tiempo aire y pago de servicios</strong><br>
      <span class="small text-muted">Muy pronto podrás recargar saldo y pagar servicios desde la app.</span>
    </div>
    <a href="/web/recargas" class="btn btn-sm btn-outline-primary flex-shrink-0">Ver</a>
  </div>
</div>
{% endblock %}
