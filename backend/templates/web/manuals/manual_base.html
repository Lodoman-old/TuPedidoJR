<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Manual de restaurante{% endblock %} | TuPedidoJR</title>
  <style>
    :root { --ink:#17212b; --muted:#5d6b7a; --blue:#0d6efd; --line:#e3e9f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:#f3f7fb; line-height:1.65; }
    header { background:#0d1b2a; color:#fff; padding:26px 0; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    header h1 { margin:0; font-size:24px; }
    header p { margin:4px 0 0; color:#c9d6e4; font-size:13px; }
    .wrap { max-width:1040px; margin:auto; padding:0 20px; }
    .layout { display:grid; grid-template-columns:250px 1fr; gap:24px; padding:26px 0 60px; }
    nav { position:sticky; top:18px; align-self:start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
    nav a { display:block; padding:7px 8px; border-radius:7px; color:#334; text-decoration:none; font-size:14px; }
    nav a:hover, nav a.active { background:#eef4ff; color:var(--blue); }
    nav .group { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 8px 5px; }
    main { background:#fff; border:1px solid var(--line); border-radius:14px; padding:30px 34px; }
    h2 { font-size:21px; margin:0 0 14px; }
    h3 { font-size:16px; margin:26px 0 8px; }
    p, li { font-size:14px; }
    code { background:#f1f4f8; padding:2px 6px; border-radius:5px; }
    .note { background:#eef4ff; border-left:4px solid var(--blue); padding:12px 14px; border-radius:0 8px 8px 0; font-size:13px; }
    .warn { background:#fff5e6; border-left:4px solid #f59f00; padding:12px 14px; border-radius:0 8px 8px 0; font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:13px; margin:12px 0; }
    th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
    th { background:#f6f9fd; }
    .btn { display:inline-block; background:var(--blue); color:#fff; padding:10px 16px; border-radius:8px; text-decoration:none; border:0; cursor:pointer; font-size:14px; }
    .print { background:#fff; color:#0d1b2a; border:1px solid #ccd6e2; }
    @media (max-width:800px) { .layout { grid-template-columns:1fr; } nav { position:static; } main { padding:22px; } }
    @media print {
      body { background:#fff; }
      header, nav, .noprint { display:none !important; }
      .layout { display:block; padding:0; }
      main { border:0; border-radius:0; padding:0; }
      a { color:inherit; text-decoration:none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <h1>{% block heading %}Manual de restaurante{% endblock %}</h1>
        <p>TuPedidoJR · Guía oficial para restaurantes</p>
      </div>
      <button class="btn print noprint" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>
  </header>
  <div class="wrap layout">
    <nav class="noprint">
      <div class="group">Manuales</div>
      <a href="/manuales/restaurante" class="{% if page == 'restaurante' %}active{% endif %}">Manual general</a>
      <a href="/manuales/menu" class="{% if page == 'menu' %}active{% endif %}">Menú y precios</a>
      <a href="/manuales/pedidos" class="{% if page == 'pedidos' %}active{% endif %}">Pedidos y cobros</a>
      <div class="group">Accesos</div>
      <a href="/web/login">Iniciar sesión</a>
      <a href="/web/register-restaurant">Registrar restaurante</a>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
