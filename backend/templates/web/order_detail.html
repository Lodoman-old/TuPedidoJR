{% extends "base.html" %}
{% block head_extra %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}
{% block content %}
<div id="orderLoading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
<div id="orderContent" class="d-none"></div>
{% endblock %}
{% block scripts %}
<script>
  const OID = '{{ order_id }}';
  const ACTIVE_STATUSES = ['pending', 'confirmed', 'awaiting_courier', 'preparing', 'ready', 'in_delivery', 'picked_up'];
  const STATUS_COLORS = {
    pending: 'bg-warning text-dark', confirmed: 'bg-info text-dark', awaiting_courier: 'bg-warning text-dark',
    preparing: 'bg-primary text-white',
    ready: 'bg-success text-white', in_delivery: 'bg-info text-white', picked_up: 'bg-primary text-white',
    delivered: 'bg-secondary text-white', cancelled: 'bg-danger text-white',
    delivery_failed: 'bg-danger text-white'
  };
  const STATUS_LABELS = {
    pending: 'Pendiente', confirmed: 'Confirmado', awaiting_courier: 'Esperando repartidor',
    preparing: 'Preparando',
    ready: 'Listo', in_delivery: 'En reparto', picked_up: 'Recogido',
    delivered: 'Entregado', cancelled: 'Cancelado', delivery_failed: 'No entregado'
  };
  const REFUND_LABELS = {
    none: 'Sin reembolso', not_required: 'No requiere',
    pending: 'Reembolso pendiente', refunded: 'Reembolsado'
  };
  function portionLabel(value) {
    const p = parseFloat(value || 0);
    if (!p || p >= 0.99) return '';
    if (Math.abs(p - 0.5) < 0.02) return '1/2';
    if (Math.abs(p - 0.3333) < 0.02) return '1/3';
    if (Math.abs(p - 0.6667) < 0.02) return '2/3';
    if (Math.abs(p - 0.25) < 0.02) return '1/4';
    if (Math.abs(p - 0.75) < 0.02) return '3/4';
    return p.toFixed(2);
  }

  let map = null;
  let courierMarker = null;
  let restaurantMarker = null;
  let destinationMarker = null;
  let routeLine = null;
  let ws = null;
  let currentOrder = null;
  let currentTracking = null;
  let paymentConfig = { mp_enabled: false, transfer_enabled: false, cep_enabled: false, receipt_validation_provider: 'gemini' };
  let bankDetails = null;
  let supportPhone = '';
  let transferBanks = [];

  const escHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
  function todayLocal() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const TRANSFER_BANKS = [
    { code: '40002', name: 'Banamex' },
    { code: '40127', name: 'Banco Azteca' },
    { code: '40012', name: 'BBVA' },
    { code: '40014', name: 'Santander' },
    { code: '40072', name: 'Banorte' },
    { code: '40021', name: 'HSBC' },
    { code: '40044', name: 'Scotiabank' },
    { code: '40036', name: 'Inbursa' },
    { code: '0', name: 'Otro banco' },
  ];

  function transferBankOptions(selected) {
    return TRANSFER_BANKS.map((bank) => (
      `<option value="${bank.code}" ${bank.code === selected ? 'selected' : ''}>${escHtml(bank.name)}</option>`
    )).join('');
  }

  function recommendedTransferAccount(senderCode) {
    const accounts = (bankDetails && bankDetails.accounts) || [];
    if (!accounts.length) return null;
    if (!senderCode || senderCode === '0') return accounts[0];
    return accounts.find((account) => account.bank_code !== senderCode) || accounts[0];
  }

  function renderTransferAccount() {
    const select = document.getElementById('transferSenderBank');
    const box = document.getElementById('transferAccountInfo');
    if (!select || !box) return;
    const accounts = (bankDetails && bankDetails.accounts) || [];
    if (!accounts.length) {
      box.innerHTML = '<span class="text-danger">La plataforma aún no configuró la cuenta bancaria.</span>';
      return;
    }
    const sender = select.value;
    if (!sender) {
      const names = accounts.map((account) => account.bank_name).filter(Boolean).join(' y ');
      box.innerHTML = `<div class="small text-muted">Selecciona tu banco para mostrarte la cuenta correcta. Si tienes ${escHtml(names)}, te mostraremos la cuenta del otro banco.</div>`;
      return;
    }
    const account = recommendedTransferAccount(sender);
    if (!account) return;
    const card = account.card ? `<br>Tarjeta: ${escHtml(account.card)}` : '';
    box.innerHTML = `<div class="border rounded p-2 bg-light">
      <div class="small fw-bold">Transfiere a ${escHtml(account.bank_name || 'la plataforma')}</div>
      <div class="small">Titular: ${escHtml(account.account_holder || '—')}<br>
      CLABE: <strong>${escHtml(account.clabe || '—')}</strong>${card}</div>
      <div class="small text-muted mt-1">Es un banco distinto al tuyo, así Banxico puede validar la transferencia.</div>
    </div>`;
    const cepSelect = document.getElementById('cepSenderBank');
    if (cepSelect && sender && sender !== '0') {
      cepSelect.value = sender;
    }
  }

  function onTransferBankChange(value) {
    renderTransferAccount();
  }

  function syncTransferBankFromCep(value) {
    const top = document.getElementById('transferSenderBank');
    if (top && value) {
      top.value = value;
      renderTransferAccount();
    }
  }

  async function switchOrderToCash() {
    const msg = document.getElementById('switchCashMsg');
    try {
      const res = await apiRequest('POST', `/orders/${OID}/switch-to-cash`);
      if (msg) {
        msg.className = 'text-success small';
        msg.textContent = res.message || 'Pago cambiado a efectivo.';
      }
      showToast('Pago cambiado a efectivo');
      setTimeout(() => loadOrder(false), 1200);
    } catch (e) {
      if (msg) {
        msg.className = 'text-danger small';
        msg.textContent = e.message;
      }
    }
  }

  async function loadOrder(connect = true) {
    const loading = document.getElementById('orderLoading');
    const content = document.getElementById('orderContent');
    try {
      const [o, t, pc, bd, sc, banks] = await Promise.all([
        getOrder(OID),
        apiRequest('GET', `/orders/${OID}/tracking`),
        apiRequest('GET', '/payments/config'),
        getBankDetails().catch(() => null),
        apiRequest('GET', '/settings/public').catch(() => ({})),
        apiRequest('GET', '/payments/transfer-banks').catch(() => []),
      ]);
      paymentConfig = pc;
      bankDetails = bd;
      supportPhone = (sc && sc.whatsapp_support) || '';
      transferBanks = Array.isArray(banks) ? banks : [];
      currentOrder = o;
      currentTracking = t;
      loading.classList.add('d-none');
      content.classList.remove('d-none');
      renderOrder(o, t);
      if (connect) connectWS(o);
    } catch (ex) {
      loading.classList.add('d-none');
      showToast(ex.message, 'danger');
    }
  }

  function renderTimeline(t) {
    if (!t || !t.timeline) return '';
    if (t.status === 'cancelled') {
      return '<div class="alert alert-danger py-2">Este pedido fue cancelado.</div>';
    }
    const steps = t.timeline.map(s => `
      <div class="d-flex align-items-start mb-2">
        <div class="me-2 flex-shrink-0" style="width:22px;height:22px;border-radius:50%;background:${s.completed ? '#198754' : '#dee2e6'};color:#fff;text-align:center;line-height:22px;font-size:12px;">${s.completed ? '✓' : ''}</div>
        <div class="${s.completed ? 'fw-semibold' : 'text-muted'}">
          ${s.label}
          ${s.at ? `<br><small class="text-muted">${new Date(s.at).toLocaleString()}</small>` : ''}
        </div>
      </div>`).join('');
    const eta = t.eta_min ? `<div class="alert alert-info py-2 small mb-2">⏱ Llegada estimada: ~${t.eta_min} min${t.distance_km != null ? ` · ${t.distance_km} km` : ''}</div>` : '';
    return `<div class="card p-3 mb-3"><h6>Seguimiento</h6>${eta}${steps}</div>`;
  }

  function renderOrder(o, t) {
    const statusLabel = o.fulfillment_type === 'pickup' && o.status === 'delivered'
      ? 'Recogido'
      : (o.fulfillment_type === 'pickup' && o.status === 'ready'
        ? 'Listo para recoger'
        : (STATUS_LABELS[o.status] || o.status));
    const statusColor = STATUS_COLORS[o.status] || 'bg-secondary';
    let html = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">Pedido #${o.id.slice(0, 8)}</h4>
        <span class="status-pill ${statusColor}">${statusLabel}</span>
      </div>
      ${renderTimeline(t)}
      ${o.fulfillment_type === 'pickup'
        ? `<div class="alert alert-info py-2 small"><i class="bi bi-shop"></i> Pedido para recoger en el negocio</div>`
        : (o.delivery_mode === 'own' ? '<div class="alert alert-info py-2 small"><i class="bi bi-shop"></i> Entrega propia del negocio</div>' : '')}
      ${o.requires_courier_approval && ['pending', 'confirmed', 'awaiting_courier'].includes(o.status) ? `<div class="alert alert-warning py-2 small">
        <i class="bi bi-hourglass-split"></i>
        ${o.delivery_person_id
          ? `<strong>Repartidor reservado.</strong> Un repartidor ya aceptó tu pedido; el negocio debe confirmarlo para comenzar a prepararlo.`
          : `<strong>Buscando repartidor.</strong> Tu pedido está lejos del negocio. Primero debe aceptarlo un repartidor y hasta entonces
             el negocio no lo prepara, para no gastar ingredientes si nadie puede llevarlo.`}
        ${o.courier_approval_deadline
          ? ` Si no hay repartidor antes de las <strong>${new Date(o.courier_approval_deadline).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}</strong>, el pedido se cancelará automáticamente y se te devolverá el dinero.`
          : ''}
      </div>` : ''}
      <div id="mapContainer" class="mb-3 ${o.fulfillment_type === 'pickup' ? 'd-none' : ''}">
        <div id="map"></div>
      </div>
      <div id="wsStatus" class="small text-muted mb-2"></div>
      <div class="card p-3 mb-3">
        <h6>Artículos</h6>
        ${(o.items || []).map(i => `
          <div class="d-flex justify-content-between small py-1">
            <span>${i.name} x${i.quantity}
              ${(i.options || []).length ? `<br><span class="text-muted">${i.options.map(o => `${o.group_name}: ${o.name}${portionLabel(o.portion) ? ` (${portionLabel(o.portion)})` : ''}`).join(' · ')}</span>` : ''}
            </span>
            <span>${money0(i.subtotal)}</span>
          </div>`).join('')}
      </div>
      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between small"><span>Subtotal</span><span>${money0(o.subtotal)}</span></div>
        <div class="d-flex justify-content-between small"><span>Envío</span><span>${money0(o.delivery_fee)}</span></div>
        <div class="d-flex justify-content-between small"><span>Cuota de servicio</span><span>${money0(o.flat_usage_fee || 0)}</span></div>` +
        (o.discount_amount > 0 ? `<div class="d-flex justify-content-between small text-success"><span>Descuento</span><span>−${money0(o.discount_amount)}</span></div>` : '') +
        (parseFloat(o.loyalty_discount || 0) > 0 ? `<div class="d-flex justify-content-between small text-primary"><span>Puntos canjeados (${o.points_redeemed || 0})</span><span>−${money0(o.loyalty_discount)}</span></div>` : '') +
        (parseFloat(o.tip_amount || 0) > 0 ? `<div class="d-flex justify-content-between small text-success"><span>Propina</span><span>${money0(o.tip_amount)}</span></div>` : '') +
        `<hr>
        <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>${money0(o.total)}</span></div>
        <div class="small text-muted mt-1">${o.fulfillment_type === 'pickup' ? 'Recoger en' : 'Dirección'}: ${o.delivery_address}</div>
      ${o.estimated_delivery_min ? `<div class="small text-primary mt-1">Tiempo estimado original: ~${o.estimated_delivery_min} min</div>` : ''}
      ${o.scheduled_for ? `<div class="small text-info mt-1">Pedido programado para: ${new Date(o.scheduled_for).toLocaleString()}</div>` : ''}
      </div>`;

    if (paymentConfig.mp_enabled && o.status === 'in_delivery' && o.payment_method === 'mp') {
      html += `<button class="btn btn-outline-primary w-100 mb-2" id="payBtn" onclick="payOrder()"><i class="bi bi-credit-card"></i> Pagar con Mercado Pago</button>`;
    }
    if (o.payment_method === 'cash' && o.status !== 'delivered' && o.status !== 'cancelled') {
      html += `<div class="alert alert-success mb-2"><i class="bi bi-cash"></i> Pagarás en efectivo al recibir</div>`;
    }
    if (o.payment_method === 'transfer' && o.status !== 'delivered' && o.status !== 'cancelled' && paymentConfig.transfer_enabled) {
      const hasBank = bankDetails && (bankDetails.bank_name || bankDetails.clabe || bankDetails.account_holder);
      const accounts = (bankDetails && bankDetails.accounts) || [];
      const savedSender = '';
      const reference = String(o.id || '').slice(0, 8).toUpperCase();
      const paid = o.payment_status === 'approved';
      if (paid) {
        if (o.cep_status === 'failed') {
          html += `<div class="alert alert-danger mb-2">
            <div class="fw-bold"><i class="bi bi-x-circle"></i> Transferencia no confirmada</div>
            <div class="small">No se pudo confirmar el pago con Banxico. El monto se cargó a tu saldo pendiente.</div>
          </div>`;
        } else if (o.cep_status === 'preapproved') {
          html += `<div class="alert alert-warning mb-2">
            <div class="fw-bold"><i class="bi bi-clock-history"></i> Pago preaprobado</div>
            <div class="small">El negocio ya puede preparar tu pedido. La confirmación final con Banxico está pendiente.</div>
          </div>`;
        } else {
          const validated = o.cep_status === 'valid'
            ? 'Pago validado por Banxico'
            : 'Pago validado';
          html += `<div class="alert alert-success mb-2">
            <div class="fw-bold"><i class="bi bi-check2-circle"></i> ${validated}</div>
            <div class="small">Total pagado: ${money0(o.total)}. El negocio ya puede preparar tu pedido.</div>
          </div>`;
        }
      } else if (accounts.length || hasBank) {
        if (o.cep_status === 'pending_cep') {
          html += `<div class="alert alert-info small mb-2"><i class="bi bi-clock"></i> Tu comprobante quedó pendiente. Banxico valida de 09:30 a 23:00; lo validaremos automáticamente al abrir.</div>`;
        }
        if (o.cep_status === 'review') {
          html += `<div class="alert alert-warning small mb-2"><i class="bi bi-hourglass-split"></i> Tu pago está en revisión. El administrador debe confirmar tu transferencia; si no se confirma, el pedido se cancelará y no se te cobrará.</div>`;
        }
        if (!paymentConfig.transfer_auto_validation_available) {
          html += `<div class="alert alert-warning mb-2">
            <div class="fw-bold"><i class="bi bi-exclamation-triangle"></i> Pago por transferencia no disponible</div>
            <div class="small">${escHtml(paymentConfig.transfer_validation_message || 'El pago por transferencia no está disponible en este momento. Elige otro método de pago, como efectivo, o intenta más tarde.')}</div>
            <button class="btn btn-sm btn-outline-dark mt-2" onclick="switchOrderToCash()">Cambiar a efectivo</button>
            <div class="small mt-1" id="switchCashMsg"></div>
          </div>`;
        } else {
          const bankSection = accounts.length >= 2
            ? `<label class="form-label small mb-1">¿Desde qué banco vas a transferir?</label>
               <select id="transferSenderBank" class="form-select form-select-sm mb-2" onchange="onTransferBankChange(this.value)">
                 <option value="">Selecciona tu banco...</option>
                 ${transferBankOptions(savedSender)}
               </select>
               <div id="transferAccountInfo"></div>`
            : `<div class="small">Banco: ${bankDetails.bank_name || (accounts[0] && accounts[0].bank_name) || '—'} · Titular: ${bankDetails.account_holder || (accounts[0] && accounts[0].account_holder) || '—'} · CLABE: ${bankDetails.clabe || (accounts[0] && accounts[0].clabe) || '—'}${(bankDetails.card || (accounts[0] && accounts[0].card)) ? ` · Tarjeta: ${bankDetails.card || accounts[0].card}` : ''}</div>`;
          const helperNote = accounts.length >= 2
            ? 'Te mostramos la cuenta de un banco distinto al tuyo para que Banxico pueda validar tu transferencia.'
            : 'Si tu cuenta es del mismo banco, sube tu comprobante para revisión manual.';
          html += `<div class="alert alert-info mb-2">
            <div class="fw-bold"><i class="bi bi-bank"></i> Pago por transferencia a TuPedidoJR (plataforma)</div>
            <div class="small mb-2">${helperNote}</div>
            ${bankSection}
            <div class="mt-3 p-2 bg-white border rounded text-center">
              <div class="small text-muted">Referencia para tu transferencia</div>
              <div class="fs-4 fw-bold" style="letter-spacing: 1px;">#${reference}</div>
            </div>
            <div class="small mt-2">
              Escribe esta referencia en el concepto y transfiere el total exacto. El dinero entra a la plataforma; TuPedidoJR liquida al negocio y paga al repartidor.
            </div>
            <div class="small mt-2 text-muted">
              El negocio prepara el pedido hasta que el pago esté confirmado.
            </div>
          </div>`;
          if (paymentConfig.cep_enabled) {
            const bankOptions = transferBanks.map((b) => `<option value="${b.code}">${escHtml(b.name)}</option>`).join('');
            const apicep = paymentConfig.receipt_validation_provider === 'apicep';
            const manualForm = `<div class="row g-2 mt-1">
                <div class="col-12"><input id="cepTrackingKey" class="form-control form-control-sm" maxlength="30" placeholder="Clave de rastreo (en tu comprobante)"></div>
                <div class="col-7"><select id="cepSenderBank" class="form-select form-select-sm" onchange="syncTransferBankFromCep(this.value)"><option value="">Banco emisor...</option>${bankOptions}</select></div>
                <div class="col-5"><input type="date" id="cepDate" class="form-control form-control-sm" value="${todayLocal()}"></div>
              </div>
              <button class="btn btn-sm btn-outline-primary mt-2" id="cepValidateBtn" onclick="validateTransferPayment()">Validar clave</button>
              <div class="small text-muted mt-1" id="cepManualMsg"></div>`;
            if (apicep) {
              html += `<div class="card p-2 mb-2">
                <div class="small fw-bold mb-1"><i class="bi bi-camera"></i> ¿Ya transferiste? Sube tu comprobante</div>
                <input type="file" id="cepReceiptFile" class="form-control form-control-sm" accept="image/jpeg,image/png,image/webp,application/pdf">
                <button class="btn btn-sm btn-primary mt-2" id="cepUploadBtn" onclick="validateTransferReceipt()">Validar mi comprobante</button>
                <div class="small text-muted mt-1" id="cepMsg"></div>
                <div class="form-text">Sube una foto o PDF legible de tu comprobante. Si no se puede leer correctamente, usa “Capturar clave de rastreo” para validar tu pago manualmente.</div>
                <a class="small" data-bs-toggle="collapse" href="#cepManual">Capturar clave de rastreo</a>
                <div class="collapse" id="cepManual">${manualForm}</div>
              </div>`;
            } else {
              html += `<div class="card p-2 mb-2">
                <div class="small fw-bold mb-1"><i class="bi bi-shield-check"></i> ¿Ya transferiste? Valida tu pago</div>
                ${manualForm}
                <div class="form-text">La validación consulta Banxico. Si no encuentra tu transferencia, revisa la clave de rastreo, el banco y la fecha.</div>
              </div>`;
            }
          } else {
            html += `<div class="alert alert-warning small mb-2"><i class="bi bi-info-circle"></i> La validación automática no está activada. Envía tu comprobante a soporte o espera la revisión.</div>`;
          }
        }
      } else {
        html += `<div class="alert alert-warning mb-2"><i class="bi bi-bank"></i> Pago por transferencia. La plataforma aún no configuró la cuenta bancaria.</div>`;
      }
    }
    if (
      o.payment_method === 'transfer'
      && o.requires_courier_approval
      && (o.status === 'awaiting_courier' || (o.status === 'cancelled' && o.refund_status === 'pending'))
    ) {
      const amount = o.refund_amount && parseFloat(o.refund_amount) > 0
        ? `${money0(o.refund_amount)}`
        : `${money0(o.total || 0)}`;
      html += `<div class="card p-3 mb-3 border-warning">
        <h6 class="mb-1"><i class="bi bi-bank"></i> Cuenta para reembolso</h6>
        <p class="small text-muted mb-2">
          ${o.status === 'cancelled'
            ? `Tu pedido se canceló y hay ${amount} pendientes de devolver.`
            : `Si ningún repartidor acepta el pedido, se te devolverán ${amount} a esta cuenta.`}
          Escribe el titular, el banco y la CLABE.
        </p>
        <input class="form-control form-control-sm mb-2" id="refundHolder" maxlength="150"
               placeholder="Titular de la cuenta" value="${o.refund_account_holder || ''}">
        <input class="form-control form-control-sm mb-2" id="refundBank" maxlength="100"
               placeholder="Banco" value="${o.refund_bank || ''}">
        <input class="form-control form-control-sm mb-2" id="refundClabe" inputmode="numeric" maxlength="18"
               placeholder="CLABE de 18 dígitos" value="${o.refund_clabe || ''}">
        <button class="btn btn-sm btn-warning" id="saveRefundBtn">Guardar cuenta de reembolso</button>
      </div>`;
    }
    if (o.status === 'cancelled') {
      html += `<div class="alert alert-secondary mb-2">
        <i class="bi bi-x-circle"></i> Pedido cancelado
        ${o.cancellation_reason ? `<br><small>Motivo: ${o.cancellation_reason}</small>` : ''}
        ${parseFloat(o.refund_amount || 0) > 0 ? `<br><small>Reembolso: ${money0(o.refund_amount)} (${REFUND_LABELS[o.refund_status] || o.refund_status})</small>` : ''}
      </div>`;
    }
    const canRepeat = (o.items || []).every(item => item.menu_item_id);
    if (canRepeat) {
      html += `<button class="btn btn-outline-primary w-100 mb-2" onclick="repeatOrder()">
        <i class="bi bi-arrow-repeat"></i> Repetir pedido
      </button>`;
    }
    if (supportPhone) {
      html += `<a class="btn btn-outline-success w-100 mb-2" target="_blank"
        href="https://wa.me/${supportPhone}?text=${encodeURIComponent(`Hola, necesito ayuda con el pedido #${o.id.slice(0, 8)}`)}">
        <i class="bi bi-whatsapp"></i> Contactar a soporte
      </a>`;
    }
    if (o.status === 'pending' || o.status === 'confirmed' || o.status === 'awaiting_courier') {
      html += `<button class="btn btn-outline-danger w-100" id="cancelBtn">Cancelar pedido</button>
        <div class="form-text text-center mt-1" id="cancelPolicy"></div>`;
    }

    document.getElementById('orderContent').innerHTML = html;
    initMap(t);
    renderTransferAccount();

    if (o.status === 'delivered') {
      renderReviewUI(o);
    }

    if (o.status === 'pending' || o.status === 'confirmed' || o.status === 'awaiting_courier') {
      getCancellationPolicy()
        .then(policy => {
          const el = document.getElementById('cancelPolicy');
          if (el) el.textContent = policy.customer_message;
        })
        .catch(() => {});
    }

    document.getElementById('saveRefundBtn')?.addEventListener('click', async () => {
      const holder = (document.getElementById('refundHolder')?.value || '').trim();
      const bank = (document.getElementById('refundBank')?.value || '').trim();
      const clabe = (document.getElementById('refundClabe')?.value || '').replace(/\D/g, '');
      if (holder.length < 3 || bank.length < 2 || clabe.length !== 18) {
        showToast('Escribe titular, banco y CLABE de 18 dígitos', 'danger');
        return;
      }
      try {
        await updateRefundAccount(OID, holder, bank, clabe);
        showToast('Cuenta de reembolso guardada');
        loadOrder(false);
      } catch (ex) { showToast(ex.message, 'danger'); }
    });

    document.getElementById('cancelBtn')?.addEventListener('click', async () => {
      const reason = prompt('Motivo de la cancelación (opcional):');
      if (reason === null) return;
      if (!confirm('¿Cancelar este pedido?')) return;
      try { await cancelOrder(OID, reason); showToast('Pedido cancelado'); setTimeout(() => loadOrder(false), 1000); }
      catch (ex) { showToast(ex.message, 'danger'); }
    });
  }

  function repeatOrder() {
    if (!currentOrder) return;
    const cart = (currentOrder.items || []).map(item => {
      const option_ids = (item.options || []).map(o => o.option_id).filter(Boolean);
      return {
        menu_item_id: item.menu_item_id,
        name: item.name,
        price: parseFloat(item.unit_price),
        base_price: parseFloat(item.unit_price) - (item.options || []).reduce((s, o) => s + parseFloat(o.price_delta || 0), 0),
        option_ids,
        option_names: (item.options || []).map(o => `${o.group_name}: ${o.name}`),
        line_key: `${item.menu_item_id}|${option_ids.slice().sort().join(',')}`,
        quantity: item.quantity,
        restaurant_id: currentOrder.restaurant_id,
      };
    });
    saveCart(cart);
    sessionStorage.setItem('cartRestaurantId', currentOrder.restaurant_id);
    window.location.href = '/web/cart';
  }

  async function renderReviewUI(o) {
    let existing = [];
    try {
      existing = await apiRequest('GET', `/reviews/order/${OID}`);
    } catch (e) { /* sin calificaciones previas */ }
    const ratedRestaurant = existing.some(r => r.restaurant_id);
    const ratedCourier = existing.some(r => r.delivery_person_id);
    const hasCourier = Boolean(o.delivery_person_id);
    let restaurantName = '';
    try {
      const resto = await apiRequest('GET', `/restaurants/${o.restaurant_id}`);
      restaurantName = resto.name || '';
    } catch (e) { /* nombre opcional */ }

    const div = document.createElement('div');
    div.className = 'card p-3 mb-3';
    div.id = 'reviewSection';
    div.innerHTML = `<h6 class="mb-2"><i class="bi bi-star"></i> Califica tu pedido</h6>`;

    function addBlock(target, title, alreadyRated) {
      const block = document.createElement('div');
      block.className = 'mb-3 pb-3 border-bottom';
      if (alreadyRated) {
        block.innerHTML = `<div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
          <div class="text-success small"><i class="bi bi-check2-circle"></i> Ya calificaste ${target === 'restaurant' ? 'este negocio' : 'a este repartidor'}.</div>`;
        div.appendChild(block);
        return;
      }
      block.innerHTML = `
        <div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
        <div class="mb-1 rating-stars"></div>
        <textarea class="form-control form-control-sm mb-2 review-comment" rows="2" placeholder="Comentario (opcional)"></textarea>
        <button class="btn btn-primary btn-sm review-submit"><i class="bi bi-send"></i> Enviar calificación</button>
        <div class="small mt-1 review-msg"></div>`;
      const starsWrap = block.querySelector('.rating-stars');
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.className = 'rating-star';
        star.dataset.val = String(i);
        star.textContent = '★';
        starsWrap.appendChild(star);
      }
      let selected = 0;
      const stars = [...starsWrap.querySelectorAll('.rating-star')];
      stars.forEach(star => star.addEventListener('click', () => {
        selected = parseInt(star.dataset.val);
        stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= selected));
      }));
      const message = block.querySelector('.review-msg');
      const button = block.querySelector('.review-submit');
      button.addEventListener('click', async () => {
        if (!selected) {
          message.className = 'small mt-1 text-danger';
          message.textContent = 'Selecciona de 1 a 5 estrellas.';
          return;
        }
        const payload = {
          order_id: OID,
          rating: selected,
          comment: block.querySelector('.review-comment').value.trim() || null,
        };
        if (target === 'restaurant') payload.restaurant_id = o.restaurant_id;
        else payload.delivery_person_id = o.delivery_person_id;
        try {
          button.disabled = true;
          await apiRequest('POST', '/reviews', payload);
          block.innerHTML = `<div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
            <div class="text-success small"><i class="bi bi-check2-circle"></i> ¡Gracias por tu calificación!</div>`;
          showToast('Calificación enviada');
        } catch (e) {
          message.className = 'small mt-1 text-danger';
          message.textContent = e.message;
          button.disabled = false;
        }
      });
      div.appendChild(block);
    }

    addBlock('restaurant', `Negocio${restaurantName ? ': ' + restaurantName : ''}`, ratedRestaurant);
    if (hasCourier) addBlock('courier', 'Repartidor', ratedCourier);

    document.getElementById('orderContent').prepend(div);
    if (window.location.hash === '#reviewSection') {
      setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'start' }), 350);
    }
  }

  async function validateTransferPayment() {
    const key = (document.getElementById('cepTrackingKey')?.value || '').trim();
    const bank = document.getElementById('cepSenderBank')?.value || '';
    const dateValue = document.getElementById('cepDate')?.value || '';
    const msg = document.getElementById('cepManualMsg');
    if (!msg) return;
    if (key.length < 4) {
      msg.className = 'text-danger small';
      msg.textContent = 'Escribe la clave de rastreo de tu comprobante.';
      return;
    }
    if (!bank) {
      msg.className = 'text-danger small';
      msg.textContent = 'Selecciona el banco desde el que transferiste.';
      return;
    }
    const btn = document.getElementById('cepValidateBtn');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Validando...';
    }
    msg.className = 'text-muted small';
    msg.textContent = 'Consultando Banxico...';
    try {
      const res = await apiRequest('POST', `/orders/${OID}/validate-transfer`, {
        clave_rastreo: key,
        sender_bank: bank,
        transfer_date: dateValue || null,
      });
      msg.className = 'text-success small';
      msg.textContent = res.message || 'Pago validado.';
      showToast('Pago validado por Banxico');
      setTimeout(() => loadOrder(false), 1200);
    } catch (e) {
      msg.className = 'text-danger small';
      msg.textContent = e.message;
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Validar mi transferencia';
      }
    }
  }

  async function validateTransferReceipt() {
    const input = document.getElementById('cepReceiptFile');
    const file = input && input.files && input.files[0];
    const msg = document.getElementById('cepMsg');
    const btn = document.getElementById('cepUploadBtn');
    if (!msg) return;
    if (!file) {
      msg.className = 'text-danger small';
      msg.textContent = 'Selecciona la foto o PDF de tu comprobante.';
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      msg.className = 'text-danger small';
      msg.textContent = 'El archivo es muy grande. Usa una foto o PDF de menos de 8 MB.';
      return;
    }
    const token = sessionStorage.getItem('token');
    const formData = new FormData();
    formData.append('file', file);
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Validando...';
    }
    msg.className = 'text-muted small';
    msg.textContent = 'Leyendo tu comprobante y consultando Banxico...';
    try {
      const headers = {};
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const r = await fetch(`${API_BASE}/orders/${OID}/validate-transfer-receipt`, {
        method: 'POST',
        headers,
        body: formData,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || `Error ${r.status}`);
      if (data.payment_status === 'approved') {
        msg.className = 'text-success small';
        msg.textContent = data.message || 'Pago validado.';
        showToast(data.cep_status === 'preapproved' ? 'Pago preaprobado' : 'Pago validado por Banxico');
      } else {
        msg.className = 'text-warning small';
        msg.textContent = data.message || 'Tu comprobante quedó en revisión.';
        showToast('Comprobante en revisión', 'warning');
      }
      setTimeout(() => loadOrder(false), 1500);
    } catch (e) {
      msg.className = 'text-danger small';
      msg.textContent = e.message;
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Validar mi comprobante';
      }
    }
  }

  async function payOrder() {
    try {
      const pref = await createPreference(OID);
      if (pref.init_point) window.open(pref.init_point, '_blank');
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  function initMap(t) {
    const el = document.getElementById('map');
    if (!el) return;
    if (map) { map.remove(); map = null; }
    const center = (t && (t.courier || t.destination || t.restaurant)) || { lat: 19.43, lng: -99.13 };
    map = L.map('map').setView([center.lat, center.lng], 15);
    createLocalTileLayer({
      attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    if (t && t.restaurant) {
      restaurantMarker = L.marker([t.restaurant.lat, t.restaurant.lng]).addTo(map).bindPopup('Negocio');
    }
    if (t && t.destination) {
      destinationMarker = L.marker([t.destination.lat, t.destination.lng]).addTo(map).bindPopup('Tu dirección');
    }
    if (t && t.courier) {
      courierMarker = L.marker([t.courier.lat, t.courier.lng]).addTo(map).bindPopup('Repartidor');
    }
    updateRoute(t);
    fitMap(t);
  }

  function updateRoute(t) {
    if (!map || !t) return;
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (t.courier && t.destination) {
      routeLine = L.polyline([
        [t.courier.lat, t.courier.lng],
        [t.destination.lat, t.destination.lng],
      ], { color: '#0d6efd', weight: 3, dashArray: '6 8' }).addTo(map);
    }
  }

  function fitMap(t) {
    if (!map) return;
    const points = [];
    if (t?.restaurant) points.push([t.restaurant.lat, t.restaurant.lng]);
    if (t?.destination) points.push([t.destination.lat, t.destination.lng]);
    if (t?.courier) points.push([t.courier.lat, t.courier.lng]);
    if (points.length > 1) map.fitBounds(points, { padding: [30, 30] });
    else if (points.length === 1) map.setView(points[0], 15);
  }

  function updateMapLocation(lat, lng) {
    if (!map) return;
    if (!courierMarker) {
      courierMarker = L.marker([lat, lng]).addTo(map).bindPopup('Repartidor');
    } else {
      courierMarker.setLatLng([lat, lng]);
    }
    if (currentTracking) {
      currentTracking.courier = { lat, lng };
      updateRoute(currentTracking);
    }
  }

  function connectWS(o) {
    const statusEl = document.getElementById('wsStatus');
    if (!ACTIVE_STATUSES.includes(o.status)) {
      if (statusEl) statusEl.textContent = 'Seguimiento finalizado';
      return;
    }
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    const token = sessionStorage.getItem('token');
    if (!token) { if (statusEl) statusEl.textContent = 'Inicia sesión para ver el seguimiento en vivo'; return; }

    if (statusEl) statusEl.textContent = 'Conectando...';
    ws = new WebSocket(`ws${location.protocol === 'https:' ? 's' : ''}://${location.host}/orders/${OID}/track?token=${encodeURIComponent(token)}`);

    ws.onopen = () => { if (statusEl) statusEl.textContent = '🟢 En vivo'; };
    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'tracking_state') {
        currentTracking = data;
        if (map) { initMap(data); }
      }
      if (data.type === 'location_update') {
        updateMapLocation(data.lat, data.lng);
        if (statusEl) statusEl.textContent = `🟢 En vivo — ${data.speed_kmh || '?'} km/h`;
      }
      if (data.type === 'status_update') {
        showToast(`Estado actualizado: ${STATUS_LABELS[data.status] || data.status}`);
        loadOrder(false);
      }
    };
    ws.onerror = () => { if (statusEl) statusEl.textContent = 'Desconectado'; };
    ws.onclose = () => { if (statusEl) statusEl.textContent = 'Desconectado'; };
  }

  loadOrder();
  setInterval(async () => {
    if (document.hidden || !currentOrder) return;
    if (!ACTIVE_STATUSES.includes(currentOrder.status)) return;
    try {
      const fresh = await getOrder(OID);
      if (fresh.status !== currentOrder.status) loadOrder(false);
    } catch (e) { /* sin conexión */ }
  }, 15000);
</script>
