{% extends "base.html" %}
{% block head_extra %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}
{% block content %}
<div id="orderLoading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
<div id="orderContent" class="d-none"></div>
{% endblock %}
{% block scripts %}
<script>
  const OID = '{{ order_id }}';
  const ACTIVE_STATUSES = ['pending', 'confirmed', 'preparing', 'ready', 'in_delivery', 'picked_up'];
  const STATUS_COLORS = {
    pending: 'bg-warning text-dark', confirmed: 'bg-info text-dark', preparing: 'bg-primary text-white',
    ready: 'bg-success text-white', in_delivery: 'bg-info text-white', picked_up: 'bg-primary text-white',
    delivered: 'bg-secondary text-white', cancelled: 'bg-danger text-white'
  };
  const STATUS_LABELS = {
    pending: 'Pendiente', confirmed: 'Confirmado', preparing: 'Preparando',
    ready: 'Listo', in_delivery: 'En reparto', picked_up: 'Recogido',
    delivered: 'Entregado', cancelled: 'Cancelado'
  };
  const REFUND_LABELS = {
    none: 'Sin reembolso', not_required: 'No requiere',
    pending: 'Reembolso pendiente', refunded: 'Reembolsado'
  };
  function portionLabel(value) {
    const p = parseFloat(value || 0);
    if (!p || p >= 0.99) return '';
    if (Math.abs(p - 0.5) < 0.02) return '1/2';
    if (Math.abs(p - 0.3333) < 0.02) return '1/3';
    if (Math.abs(p - 0.6667) < 0.02) return '2/3';
    if (Math.abs(p - 0.25) < 0.02) return '1/4';
    if (Math.abs(p - 0.75) < 0.02) return '3/4';
    return p.toFixed(2);
  }

  let map = null;
  let courierMarker = null;
  let restaurantMarker = null;
  let destinationMarker = null;
  let routeLine = null;
  let ws = null;
  let currentOrder = null;
  let currentTracking = null;
  let paymentConfig = { mp_enabled: false, transfer_enabled: false };
  let bankDetails = null;
  let supportPhone = '';

  async function loadOrder(connect = true) {
    const loading = document.getElementById('orderLoading');
    const content = document.getElementById('orderContent');
    try {
      const [o, t, pc, bd, sc] = await Promise.all([
        getOrder(OID),
        apiRequest('GET', `/orders/${OID}/tracking`),
        apiRequest('GET', '/payments/config'),
        getBankDetails().catch(() => null),
        apiRequest('GET', '/settings/public').catch(() => ({})),
      ]);
      paymentConfig = pc;
      bankDetails = bd;
      supportPhone = (sc && sc.whatsapp_support) || '';
      currentOrder = o;
      currentTracking = t;
      loading.classList.add('d-none');
      content.classList.remove('d-none');
      renderOrder(o, t);
      if (connect) connectWS(o);
    } catch (ex) {
      loading.classList.add('d-none');
      showToast(ex.message, 'danger');
    }
  }

  function renderTimeline(t) {
    if (!t || !t.timeline) return '';
    if (t.status === 'cancelled') {
      return '<div class="alert alert-danger py-2">Este pedido fue cancelado.</div>';
    }
    const steps = t.timeline.map(s => `
      <div class="d-flex align-items-start mb-2">
        <div class="me-2 flex-shrink-0" style="width:22px;height:22px;border-radius:50%;background:${s.completed ? '#198754' : '#dee2e6'};color:#fff;text-align:center;line-height:22px;font-size:12px;">${s.completed ? '✓' : ''}</div>
        <div class="${s.completed ? 'fw-semibold' : 'text-muted'}">
          ${s.label}
          ${s.at ? `<br><small class="text-muted">${new Date(s.at).toLocaleString()}</small>` : ''}
        </div>
      </div>`).join('');
    const eta = t.eta_min ? `<div class="alert alert-info py-2 small mb-2">⏱ Llegada estimada: ~${t.eta_min} min${t.distance_km ? ` · ${t.distance_km} km` : ''}</div>` : '';
    return `<div class="card p-3 mb-3"><h6>Seguimiento</h6>${eta}${steps}</div>`;
  }

  function renderOrder(o, t) {
    const statusLabel = o.fulfillment_type === 'pickup' && o.status === 'delivered'
      ? 'Recogido'
      : (o.fulfillment_type === 'pickup' && o.status === 'ready'
        ? 'Listo para recoger'
        : (STATUS_LABELS[o.status] || o.status));
    const statusColor = STATUS_COLORS[o.status] || 'bg-secondary';
    let html = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">Pedido #${o.id.slice(0, 8)}</h4>
        <span class="status-pill ${statusColor}">${statusLabel}</span>
      </div>
      ${renderTimeline(t)}
      ${o.fulfillment_type === 'pickup'
        ? `<div class="alert alert-info py-2 small"><i class="bi bi-shop"></i> Pedido para recoger en el restaurante</div>`
        : (o.delivery_mode === 'own' ? '<div class="alert alert-info py-2 small"><i class="bi bi-shop"></i> Entrega propia del restaurante</div>' : '')}
      <div id="mapContainer" class="mb-3 ${o.fulfillment_type === 'pickup' ? 'd-none' : ''}">
        <div id="map"></div>
      </div>
      <div id="wsStatus" class="small text-muted mb-2"></div>
      <div class="card p-3 mb-3">
        <h6>Artículos</h6>
        ${(o.items || []).map(i => `
          <div class="d-flex justify-content-between small py-1">
            <span>${i.name} x${i.quantity}
              ${(i.options || []).length ? `<br><span class="text-muted">${i.options.map(o => `${o.group_name}: ${o.name}${portionLabel(o.portion) ? ` (${portionLabel(o.portion)})` : ''}`).join(' · ')}</span>` : ''}
            </span>
            <span>$${parseFloat(i.subtotal).toFixed(2)}</span>
          </div>`).join('')}
      </div>
      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between small"><span>Subtotal</span><span>$${parseFloat(o.subtotal).toFixed(2)}</span></div>
        <div class="d-flex justify-content-between small"><span>Envío</span><span>$${parseFloat(o.delivery_fee).toFixed(2)}</span></div>
        <div class="d-flex justify-content-between small"><span>Comisión por uso de la plataforma</span><span>$${parseFloat(o.flat_usage_fee || 0).toFixed(2)}</span></div>` +
        (o.discount_amount > 0 ? `<div class="d-flex justify-content-between small text-success"><span>Descuento</span><span>−$${parseFloat(o.discount_amount).toFixed(2)}</span></div>` : '') +
        (parseFloat(o.loyalty_discount || 0) > 0 ? `<div class="d-flex justify-content-between small text-primary"><span>Puntos canjeados (${o.points_redeemed || 0})</span><span>−$${parseFloat(o.loyalty_discount).toFixed(2)}</span></div>` : '') +
        (parseFloat(o.tip_amount || 0) > 0 ? `<div class="d-flex justify-content-between small text-success"><span>Propina</span><span>$${parseFloat(o.tip_amount).toFixed(2)}</span></div>` : '') +
        `<hr>
        <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>$${parseFloat(o.total).toFixed(2)}</span></div>
        <div class="small text-muted mt-1">${o.fulfillment_type === 'pickup' ? 'Recoger en' : 'Dirección'}: ${o.delivery_address}</div>
      ${o.estimated_delivery_min ? `<div class="small text-primary mt-1">Tiempo estimado original: ~${o.estimated_delivery_min} min</div>` : ''}
      ${o.scheduled_for ? `<div class="small text-info mt-1">Pedido programado para: ${new Date(o.scheduled_for).toLocaleString()}</div>` : ''}
      </div>`;

    if (paymentConfig.mp_enabled && o.status === 'in_delivery' && o.payment_method === 'mp') {
      html += `<button class="btn btn-outline-primary w-100 mb-2" id="payBtn" onclick="payOrder()"><i class="bi bi-credit-card"></i> Pagar con Mercado Pago</button>`;
    }
    if (o.payment_method === 'cash' && o.status !== 'delivered' && o.status !== 'cancelled') {
      html += `<div class="alert alert-success mb-2"><i class="bi bi-cash"></i> Pagarás en efectivo al recibir</div>`;
    }
    if (o.payment_method === 'transfer' && o.status !== 'delivered' && o.status !== 'cancelled' && paymentConfig.transfer_enabled) {
      const hasBank = bankDetails && (bankDetails.bank_name || bankDetails.clabe || bankDetails.account_holder);
      html += hasBank
        ? `<div class="alert alert-info mb-2"><i class="bi bi-bank"></i> Pago por transferencia a TuPedidoJR (plataforma)<br>
             <small>Banco: ${bankDetails.bank_name || '—'} · Titular: ${bankDetails.account_holder || '—'} · CLABE: ${bankDetails.clabe || '—'}${bankDetails.card ? ` · Tarjeta: ${bankDetails.card}` : ''}<br>
             El dinero entra a la plataforma. TuPedidoJR liquida al restaurante y paga al repartidor; no pagas en efectivo al recibir.</small></div>`
        : `<div class="alert alert-warning mb-2"><i class="bi bi-bank"></i> Pago por transferencia. La plataforma aún no configuró la cuenta bancaria.</div>`;
    }
    if (o.status === 'cancelled') {
      html += `<div class="alert alert-secondary mb-2">
        <i class="bi bi-x-circle"></i> Pedido cancelado
        ${o.cancellation_reason ? `<br><small>Motivo: ${o.cancellation_reason}</small>` : ''}
        ${parseFloat(o.refund_amount || 0) > 0 ? `<br><small>Reembolso: $${parseFloat(o.refund_amount).toFixed(2)} (${REFUND_LABELS[o.refund_status] || o.refund_status})</small>` : ''}
      </div>`;
    }
    html += `<button class="btn btn-outline-primary w-100 mb-2" onclick="repeatOrder()">
      <i class="bi bi-arrow-repeat"></i> Repetir pedido
    </button>`;
    if (supportPhone) {
      html += `<a class="btn btn-outline-success w-100 mb-2" target="_blank"
        href="https://wa.me/${supportPhone}?text=${encodeURIComponent(`Hola, necesito ayuda con el pedido #${o.id.slice(0, 8)}`)}">
        <i class="bi bi-whatsapp"></i> Contactar a soporte
      </a>`;
    }
    if (o.status === 'pending' || o.status === 'confirmed') {
      html += `<button class="btn btn-outline-danger w-100" id="cancelBtn">Cancelar pedido</button>
        <div class="form-text text-center mt-1" id="cancelPolicy"></div>`;
    }

    document.getElementById('orderContent').innerHTML = html;
    initMap(t);

    if (o.status === 'delivered') {
      renderReviewUI(o);
    }

    if (o.status === 'pending' || o.status === 'confirmed') {
      getCancellationPolicy()
        .then(policy => {
          const el = document.getElementById('cancelPolicy');
          if (el) el.textContent = policy.customer_message;
        })
        .catch(() => {});
    }

    document.getElementById('cancelBtn')?.addEventListener('click', async () => {
      const reason = prompt('Motivo de la cancelación (opcional):');
      if (reason === null) return;
      if (!confirm('¿Cancelar este pedido?')) return;
      try { await cancelOrder(OID, reason); showToast('Pedido cancelado'); setTimeout(() => loadOrder(false), 1000); }
      catch (ex) { showToast(ex.message, 'danger'); }
    });
  }

  function repeatOrder() {
    if (!currentOrder) return;
    const cart = (currentOrder.items || []).map(item => {
      const option_ids = (item.options || []).map(o => o.option_id).filter(Boolean);
      return {
        menu_item_id: item.menu_item_id,
        name: item.name,
        price: parseFloat(item.unit_price),
        base_price: parseFloat(item.unit_price) - (item.options || []).reduce((s, o) => s + parseFloat(o.price_delta || 0), 0),
        option_ids,
        option_names: (item.options || []).map(o => `${o.group_name}: ${o.name}`),
        line_key: `${item.menu_item_id}|${option_ids.slice().sort().join(',')}`,
        quantity: item.quantity,
        restaurant_id: currentOrder.restaurant_id,
      };
    });
    saveCart(cart);
    sessionStorage.setItem('cartRestaurantId', currentOrder.restaurant_id);
    window.location.href = '/web/cart';
  }

  async function renderReviewUI(o) {
    let existing = [];
    try {
      existing = await apiRequest('GET', `/reviews/order/${OID}`);
    } catch (e) { /* sin calificaciones previas */ }
    const ratedRestaurant = existing.some(r => r.restaurant_id);
    const ratedCourier = existing.some(r => r.delivery_person_id);
    const hasCourier = Boolean(o.delivery_person_id);
    let restaurantName = '';
    try {
      const resto = await apiRequest('GET', `/restaurants/${o.restaurant_id}`);
      restaurantName = resto.name || '';
    } catch (e) { /* nombre opcional */ }

    const div = document.createElement('div');
    div.className = 'card p-3 mb-3';
    div.id = 'reviewSection';
    div.innerHTML = `<h6 class="mb-2"><i class="bi bi-star"></i> Califica tu pedido</h6>`;

    function addBlock(target, title, alreadyRated) {
      const block = document.createElement('div');
      block.className = 'mb-3 pb-3 border-bottom';
      if (alreadyRated) {
        block.innerHTML = `<div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
          <div class="text-success small"><i class="bi bi-check2-circle"></i> Ya calificaste ${target === 'restaurant' ? 'este restaurante' : 'a este repartidor'}.</div>`;
        div.appendChild(block);
        return;
      }
      block.innerHTML = `
        <div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
        <div class="mb-1 rating-stars"></div>
        <textarea class="form-control form-control-sm mb-2 review-comment" rows="2" placeholder="Comentario (opcional)"></textarea>
        <button class="btn btn-primary btn-sm review-submit"><i class="bi bi-send"></i> Enviar calificación</button>
        <div class="small mt-1 review-msg"></div>`;
      const starsWrap = block.querySelector('.rating-stars');
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.className = 'rating-star';
        star.dataset.val = String(i);
        star.textContent = '★';
        starsWrap.appendChild(star);
      }
      let selected = 0;
      const stars = [...starsWrap.querySelectorAll('.rating-star')];
      stars.forEach(star => star.addEventListener('click', () => {
        selected = parseInt(star.dataset.val);
        stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= selected));
      }));
      const message = block.querySelector('.review-msg');
      const button = block.querySelector('.review-submit');
      button.addEventListener('click', async () => {
        if (!selected) {
          message.className = 'small mt-1 text-danger';
          message.textContent = 'Selecciona de 1 a 5 estrellas.';
          return;
        }
        const payload = {
          order_id: OID,
          rating: selected,
          comment: block.querySelector('.review-comment').value.trim() || null,
        };
        if (target === 'restaurant') payload.restaurant_id = o.restaurant_id;
        else payload.delivery_person_id = o.delivery_person_id;
        try {
          button.disabled = true;
          await apiRequest('POST', '/reviews', payload);
          block.innerHTML = `<div class="fw-bold small mb-1">${AddressUtils.escapeHtml(title)}</div>
            <div class="text-success small"><i class="bi bi-check2-circle"></i> ¡Gracias por tu calificación!</div>`;
          showToast('Calificación enviada');
        } catch (e) {
          message.className = 'small mt-1 text-danger';
          message.textContent = e.message;
          button.disabled = false;
        }
      });
      div.appendChild(block);
    }

    addBlock('restaurant', `Restaurante${restaurantName ? ': ' + restaurantName : ''}`, ratedRestaurant);
    if (hasCourier) addBlock('courier', 'Repartidor', ratedCourier);

    document.getElementById('orderContent').prepend(div);
    if (window.location.hash === '#reviewSection') {
      setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'start' }), 350);
    }
  }

  async function payOrder() {
    try {
      const pref = await createPreference(OID);
      if (pref.init_point) window.open(pref.init_point, '_blank');
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  function initMap(t) {
    const el = document.getElementById('map');
    if (!el) return;
    if (map) { map.remove(); map = null; }
    const center = (t && (t.courier || t.destination || t.restaurant)) || { lat: 19.43, lng: -99.13 };
    map = L.map('map').setView([center.lat, center.lng], 15);
    createLocalTileLayer({
      attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    if (t && t.restaurant) {
      restaurantMarker = L.marker([t.restaurant.lat, t.restaurant.lng]).addTo(map).bindPopup('Restaurante');
    }
    if (t && t.destination) {
      destinationMarker = L.marker([t.destination.lat, t.destination.lng]).addTo(map).bindPopup('Tu dirección');
    }
    if (t && t.courier) {
      courierMarker = L.marker([t.courier.lat, t.courier.lng]).addTo(map).bindPopup('Repartidor');
    }
    updateRoute(t);
    fitMap(t);
  }

  function updateRoute(t) {
    if (!map || !t) return;
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (t.courier && t.destination) {
      routeLine = L.polyline([
        [t.courier.lat, t.courier.lng],
        [t.destination.lat, t.destination.lng],
      ], { color: '#0d6efd', weight: 3, dashArray: '6 8' }).addTo(map);
    }
  }

  function fitMap(t) {
    if (!map) return;
    const points = [];
    if (t?.restaurant) points.push([t.restaurant.lat, t.restaurant.lng]);
    if (t?.destination) points.push([t.destination.lat, t.destination.lng]);
    if (t?.courier) points.push([t.courier.lat, t.courier.lng]);
    if (points.length > 1) map.fitBounds(points, { padding: [30, 30] });
    else if (points.length === 1) map.setView(points[0], 15);
  }

  function updateMapLocation(lat, lng) {
    if (!map) return;
    if (!courierMarker) {
      courierMarker = L.marker([lat, lng]).addTo(map).bindPopup('Repartidor');
    } else {
      courierMarker.setLatLng([lat, lng]);
    }
    if (currentTracking) {
      currentTracking.courier = { lat, lng };
      updateRoute(currentTracking);
    }
  }

  function connectWS(o) {
    const statusEl = document.getElementById('wsStatus');
    if (!ACTIVE_STATUSES.includes(o.status)) {
      if (statusEl) statusEl.textContent = 'Seguimiento finalizado';
      return;
    }
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    const token = sessionStorage.getItem('token');
    if (!token) { if (statusEl) statusEl.textContent = 'Inicia sesión para ver el seguimiento en vivo'; return; }

    if (statusEl) statusEl.textContent = 'Conectando...';
    ws = new WebSocket(`ws${location.protocol === 'https:' ? 's' : ''}://${location.host}/orders/${OID}/track?token=${encodeURIComponent(token)}`);

    ws.onopen = () => { if (statusEl) statusEl.textContent = '🟢 En vivo'; };
    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'tracking_state') {
        currentTracking = data;
        if (map) { initMap(data); }
      }
      if (data.type === 'location_update') {
        updateMapLocation(data.lat, data.lng);
        if (statusEl) statusEl.textContent = `🟢 En vivo — ${data.speed_kmh || '?'} km/h`;
      }
      if (data.type === 'status_update') {
        showToast(`Estado actualizado: ${STATUS_LABELS[data.status] || data.status}`);
        loadOrder(false);
      }
    };
    ws.onerror = () => { if (statusEl) statusEl.textContent = 'Desconectado'; };
    ws.onclose = () => { if (statusEl) statusEl.textContent = 'Desconectado'; };
  }

  loadOrder();
  setInterval(async () => {
    if (document.hidden || !currentOrder) return;
    if (!ACTIVE_STATUSES.includes(currentOrder.status)) return;
    try {
      const fresh = await getOrder(OID);
      if (fresh.status !== currentOrder.status) loadOrder(false);
    } catch (e) { /* sin conexión */ }
  }, 15000);
</script>
{% endblock %}
