{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h4 class="m-0"><i class="bi bi-wallet2"></i> Pagos a restaurantes y repartidores</h4>
  <button class="btn btn-outline-secondary btn-sm" onclick="loadPayouts()">
    <i class="bi bi-arrow-clockwise"></i> Actualizar
  </button>
</div>
<div id="payoutsError" class="alert alert-danger d-none"></div>
<div id="refundsCard" class="mb-3"></div>
<div id="reservationDepositsCard" class="mb-3"></div>
<div id="mandadoPrepaymentsCard" class="mb-3"></div>
<div id="mandadoAdvancesCard" class="mb-3"></div>
<div id="payoutsLoading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
<div id="payoutsContent" class="d-none"></div>

<div class="modal fade" id="payoutPaidModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="payoutPaidTitle">Confirmar liquidación</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-0" id="payoutPaidSummary"></p>
        <div id="payoutCodeBox" class="mt-3 d-none">
          <label class="form-label small mb-1" for="payoutCodeInput">Código del corte</label>
          <input id="payoutCodeInput" class="form-control" inputmode="numeric" maxlength="6"
                 autocomplete="off" placeholder="6 dígitos">
          <div class="form-text">Pídelo al repartidor. Confirma que el efectivo ya está en la plataforma.</div>
        </div>
        <div id="payoutPaidError" class="text-danger small mt-2 d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-sm btn-success" id="payoutPaidBtn" onclick="confirmPayoutPaid()">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="businessBalanceModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="businessBalanceTitle">Cuenta del negocio</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="businessBalanceBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const money = n => '$' + parseFloat(n || 0).toFixed(2);

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function frequencyOptions(selected) {
    const options = [[0, 'Otro: a demanda (varias veces al día)'], [1, 'Diario'], [3, 'Cada 3 días'], [7, 'Semanal'], [15, 'Quincenal'], [30, 'Mensual']];
    if (!options.some(([value]) => Number(selected) === value)) {
      options.push([Number(selected), `Cada ${selected} días`]);
    }
    return options.map(([value, label]) =>
      `<option value="${value}" ${Number(selected) === value ? 'selected' : ''}>${label}</option>`
    ).join('');
  }

  function statusBadge(status) {
    if (status === 'due') return '<span class="badge bg-success">Listo para pagar</span>';
    if (status === 'scheduled') return '<span class="badge bg-secondary">Programado</span>';
    return '<span class="badge bg-light text-dark">Sin saldo</span>';
  }

  function summaryCard(label, value, color = '') {
    return `<div class="col-6 col-md-3"><div class="card p-3 text-center ${color}">
      <small class="text-muted">${label}</small><strong class="fs-5">${value}</strong>
    </div></div>`;
  }

  let restaurantsById = {};

  function renderRestaurants(restaurants) {
    restaurantsById = Object.fromEntries(restaurants.map(r => [String(r.id), r]));
    return `<div class="card p-3 mb-3">
      <h6>Restaurantes</h6>
      <p class="small text-muted">La comisión individual reemplaza la comisión global. Si dejas el campo vacío, se usa la global.<br>
        <strong>Se le debe</strong> es lo que la plataforma le pagará. <strong>Debe</strong> es el efectivo o los cargos que el negocio cobró por la plataforma. <strong>Neto</strong> es lo que realmente se paga o se cobra.</p>
      <div class="table-responsive"><table class="table table-sm align-middle" style="min-width:1220px">
        <thead><tr>
          <th>Restaurante</th><th class="text-end">Ventas 30d</th><th class="text-end">Se le debe</th><th class="text-end">Debe a plataforma</th><th class="text-end">Neto</th><th>Comisión %</th>
          <th>Frecuencia</th><th>Próximo pago</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody>${restaurants.map(r => {
          const net = parseFloat(r.net_amount || 0);
          const netLabel = net > 0
            ? `<span class="text-success fw-bold">Pagar ${money(net)}</span>`
            : (net < 0
              ? `<span class="text-danger fw-bold">Cobrar ${money(Math.abs(net))}</span>`
              : '<span class="text-muted">Sin saldo</span>');
          return `<tr>
            <td>${esc(r.name)}</td>
            <td class="text-end">${money(r.monthly_sales)}</td>
            <td class="text-end fw-bold">${money(r.pending_amount)}</td>
            <td class="text-end text-danger">${money(r.restaurant_debt || 0)}</td>
            <td class="text-end">${netLabel}</td>
            <td style="min-width:110px">
              <input type="number" class="form-control form-control-sm" id="r_comm_${r.id}"
                     min="0" max="100" step="0.1" value="${r.uses_global_commission ? '' : r.commission_percentage}"
                     placeholder="Global">
            </td>
            <td style="min-width:120px">
              <select class="form-select form-select-sm" id="r_freq_${r.id}">
                ${frequencyOptions(r.payout_frequency_days)}
              </select>
            </td>
            <td>${r.next_payout_date || '—'}</td>
            <td>${statusBadge(r.status)}</td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-outline-secondary" onclick="openBusinessBalance('${r.id}')" title="Ver desglose">
                <i class="bi bi-eye"></i> Detalle
              </button>
              <button class="btn btn-sm btn-outline-primary" onclick="saveRestaurant('${r.id}')">Guardar</button>
              <button class="btn btn-sm btn-success" onclick="payRestaurant('${r.id}')"
                      ${parseFloat(r.pending_amount) <= 0 ? 'disabled' : ''}>Generar pago</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  function renderCouriers(couriers) {
    return `<div class="card p-3 mb-3">
      <h6>Repartidores</h6>
      <p class="small text-muted">El bono por envío se suma a la ganancia base de cada pedido que acepte el repartidor.</p>
      <div class="table-responsive"><table class="table table-sm align-middle" style="min-width:1400px">
        <thead><tr>
          <th>Repartidor</th><th class="text-end">Pendiente</th><th>Bono por envío</th>
          <th>Método de pago</th><th>Frecuencia</th><th class="text-end">Deuda</th><th class="text-end">Avances</th><th class="text-end">Saldo del corte</th><th>Próximo pago</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody>${couriers.map(c => `
          <tr>
            <td>${esc(c.name)}<br><small class="text-muted text-break">${esc(c.email || '')}</small></td>
            <td class="text-end fw-bold">${money(c.pending_amount)}</td>
            <td style="min-width:120px">
              <input type="number" class="form-control form-control-sm" id="c_bonus_${c.id}"
                     min="0" step="0.5" value="${c.delivery_bonus_per_order}">
            </td>
            <td style="min-width:160px">
              <select class="form-select form-select-sm" id="c_method_${c.id}">
                <option value="cash" ${c.payout_method === 'cash' ? 'selected' : ''}>Efectivo</option>
                <option value="transfer" ${c.payout_method === 'transfer' ? 'selected' : ''}>Transferencia</option>
              </select>
              <small class="text-muted d-block mt-1">
                ${c.payout_method === 'transfer'
                  ? `${esc(c.bank_name || 'Sin banco')} · ${esc(c.bank_account_holder || 'Sin titular')}<br>CLABE: ${esc(c.bank_clabe || 'Sin capturar')}`
                  : 'Sin datos bancarios'}
              </small>
            </td>
            <td style="min-width:120px">
              <select class="form-select form-select-sm" id="c_freq_${c.id}">
                ${frequencyOptions(c.payout_frequency_days)}
              </select>
            </td>
            <td class="text-end text-danger">${money(c.pending_debt)}</td>
            <td class="text-end text-warning">${money(c.pending_advances)}</td>
            <td class="text-end ${parseFloat(c.net_amount || 0) < 0 ? 'text-danger' : 'text-success'} fw-bold">
              ${parseFloat(c.net_amount || 0) < 0 ? '−' : '+'}${money(Math.abs(parseFloat(c.net_amount || 0)))}
              <br><small class="text-muted">${parseFloat(c.net_amount || 0) < 0 ? 'Por entregar' : 'Por pagar'}</small>
            </td>
            <td>${c.next_payout_date || '—'}</td>
            <td>${statusBadge(c.status)}</td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-outline-primary" onclick="saveCourier('${c.id}')">Guardar</button>
              <button class="btn btn-sm btn-success" onclick="payCourier('${c.id}')"
                      ${parseFloat(c.net_amount || 0) === 0 ? 'disabled' : ''}>Generar corte</button>
            </td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  function renderAdvances(advances) {
    const statusLabel = {
      pending: 'Solicitado', approved: 'Entregado', settled: 'Liquidado', rejected: 'Rechazado',
    };
    const rows = (advances || []).map(a => {
      let actions = '';
      if (a.status === 'pending') {
        actions = `
          <button class="btn btn-sm btn-success" onclick="approveAdvanceUI('${a.id}', true)">Pagar restaurante</button>
          <button class="btn btn-sm btn-outline-warning" onclick="approveAdvanceUI('${a.id}', false)">Préstamo</button>
          <button class="btn btn-sm btn-outline-danger" onclick="rejectAdvanceUI('${a.id}')">Rechazar</button>`;
      } else if (a.status === 'approved' && !a.pays_restaurant) {
        actions = `<button class="btn btn-sm btn-outline-primary" onclick="settleAdvanceUI('${a.id}')">Liquidar en efectivo</button>`;
      } else if (a.status === 'approved' && a.pays_restaurant) {
        actions = `<button class="btn btn-sm btn-outline-secondary" onclick="settleAdvanceUI('${a.id}')">Marcar pagado</button>`;
      }
      return `<tr>
        <td>${esc(a.courier_name || '—')}</td>
        <td>${a.order_id ? '#' + a.order_id.slice(0, 8) : '—'}<br><small class="text-muted">${esc(a.restaurant_name || '')}</small></td>
        <td class="text-end fw-bold">${money(a.amount)}</td>
        <td><span class="badge bg-${a.status === 'pending' ? 'warning' : a.status === 'approved' ? 'info' : a.status === 'settled' ? 'success' : 'secondary'}">${statusLabel[a.status] || a.status}</span></td>
        <td class="small">${a.pays_restaurant ? 'Pago al restaurante' : 'Préstamo al repartidor'}</td>
        <td class="text-end text-nowrap">${actions}</td>
      </tr>`;
    }).join('');

    return `<div class="card p-3 mb-3">
      <h6>Avances de efectivo</h6>
      <p class="small text-muted">Si se entrega para pagar al restaurante, ese pedido se excluye de la liquidación del restaurante. Si es préstamo, se descuenta del pago del repartidor.</p>
      ${rows ? `<div class="table-responsive"><table class="table table-sm align-middle">
        <thead><tr><th>Repartidor</th><th>Pedido</th><th class="text-end">Monto</th><th>Estado</th><th>Tipo</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : '<p class="small text-muted mb-0">Sin avances registrados.</p>'}
    </div>`;
  }

  function renderTransfers(transfers) {
    if (!transfers || !transfers.length) {
      return '<div class="card p-3 mb-3"><h6>Transferencias pendientes</h6><p class="small text-muted mb-0">No hay transferencias pendientes de confirmar.</p></div>';
    }
    return `<div class="card p-3 mb-3">
      <h6>Transferencias pendientes de confirmar</h6>
      <p class="small text-muted">Estas órdenes aún no cuentan para liquidaciones hasta que confirmes que el dinero llegó a la cuenta de la plataforma.</p>
      <div class="table-responsive"><table class="table table-sm align-middle">
        <thead><tr><th>Pedido</th><th>Restaurante</th><th class="text-end">Monto</th><th>Fecha</th><th></th></tr></thead>
        <tbody>${transfers.map(t => `
          <tr>
            <td>#${t.id.slice(0, 8)}</td>
            <td>${esc(t.restaurant_name)}</td>
            <td class="text-end fw-bold">${money(t.amount)}</td>
            <td class="small">${t.placed_at ? new Date(t.placed_at).toLocaleString() : '—'}</td>
            <td class="text-end"><button class="btn btn-sm btn-success" onclick="confirmTransfer('${t.id}')">Marcar recibida</button></td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }

  function openBusinessBalance(id) {
    const r = restaurantsById[String(id)];
    if (!r) return;
    const pending = parseFloat(r.pending_amount || 0);
    const debt = parseFloat(r.restaurant_debt || 0);
    const net = parseFloat(r.net_amount || 0);
    const netBlock = net > 0
      ? `<div class="alert alert-success mb-0"><strong>La plataforma le paga al negocio:</strong> ${money(net)}</div>`
      : (net < 0
        ? `<div class="alert alert-danger mb-0"><strong>El negocio debe entregar a la plataforma:</strong> ${money(Math.abs(net))}</div>`
        : '<div class="alert alert-secondary mb-0"><strong>Sin saldo pendiente.</strong></div>');
    document.getElementById('businessBalanceTitle').textContent = r.name || 'Negocio';
    document.getElementById('businessBalanceBody').innerHTML = `
      <div class="row g-2 mb-3">
        <div class="col-6"><div class="border rounded p-2 text-center">
          <small class="text-muted d-block">Se le debe al negocio</small>
          <strong class="text-success fs-5">${money(pending)}</strong>
        </div></div>
        <div class="col-6"><div class="border rounded p-2 text-center">
          <small class="text-muted d-block">El negocio debe</small>
          <strong class="text-danger fs-5">${money(debt)}</strong>
        </div></div>
      </div>
      ${netBlock}
      <table class="table table-sm mt-3 mb-0">
        <tbody>
          <tr><td>Ventas últimos 30 días</td><td class="text-end">${money(r.monthly_sales)}</td></tr>
          <tr><td>Ganancia neta acumulada</td><td class="text-end fw-bold">${money(r.earned_total)}</td></tr>
          <tr><td>Comisión de la plataforma (ya descontada)</td><td class="text-end">${money(r.commission_total)}</td></tr>
          <tr><td>Cuota fija por pedido (ya descontada)</td><td class="text-end">${money(r.flat_fee_total)}</td></tr>
          <tr><td>Envíos de negocio a favor</td><td class="text-end">${money(r.shipment_credit)}</td></tr>
          <tr><td>Envíos de negocio por cobrar</td><td class="text-end">${money(r.shipment_charge)}</td></tr>
          <tr><td>Ajustes a favor</td><td class="text-end">${money(r.adjustment_credit)}</td></tr>
          <tr><td>Ajustes por cobrar</td><td class="text-end">${money(r.adjustment_charge)}</td></tr>
          <tr><td>Puntos absorbidos por la plataforma</td><td class="text-end">${money(r.loyalty_credit)}</td></tr>
          <tr><td>Pedidos considerados</td><td class="text-end">${r.orders_count || 0}</td></tr>
        </tbody>
      </table>
      <p class="small text-muted mt-3 mb-0">La ganancia neta ya incluye comisiones, envíos, ajustes y puntos. La plataforma le debe ${money(pending)} y el negocio debe ${money(debt)}. Al generar el pago se aplica el neto: ${net > 0 ? `se le pagan ${money(net)}` : net < 0 ? `se le cobran ${money(Math.abs(net))}` : 'no hay movimiento'}.</p>
    `;
    new bootstrap.Modal(document.getElementById('businessBalanceModal')).show();
  }

  function renderPendingPayouts(history) {
    const rows = history.filter(h => h.status === 'pending');
    if (!rows.length) return '';
    return `<div class="card p-3 mb-3 border-warning">
      <h6 class="m-0"><i class="bi bi-hourglass-split"></i> Cortes pendientes de cerrar</h6>
      <p class="small text-muted mb-2">Aquí confirmas cuando el repartidor te entrega el efectivo o cuando la plataforma le paga.</p>
      <div class="table-responsive"><table class="table table-sm align-middle mb-0">
        <thead><tr><th>Tipo</th><th>Nombre</th><th class="text-end">Monto</th><th>Concepto</th><th>Código</th><th></th></tr></thead>
        <tbody>${rows.map(h => {
          const isCourier = h.kind === 'courier';
          const toPlatform = isCourier && h.direction === 'to_platform';
          return `<tr>
            <td>${isCourier ? 'Repartidor' : 'Restaurante'}</td>
            <td>${esc(h.name)}</td>
            <td class="text-end fw-bold">${money(h.amount)}</td>
            <td>${!isCourier
              ? '<span class="badge bg-primary">Pago al negocio</span>'
              : (toPlatform
                ? '<span class="badge bg-warning text-dark">Repartidor entrega efectivo</span>'
                : '<span class="badge bg-info text-dark">Plataforma paga al repartidor</span>')}</td>
            <td>${isCourier && h.confirmation_code ? `<strong>${esc(h.confirmation_code)}</strong>` : '—'}</td>
            <td class="text-end">
              ${isCourier
                ? `<button class="btn btn-sm ${toPlatform ? 'btn-warning' : 'btn-success'}" onclick="openPayoutPaid('courier','${h.id}','${h.direction}','${esc(h.confirmation_code || '')}')">${toPlatform ? 'Recibí el efectivo' : 'Marcar pagada'}</button>`
                : `<button class="btn btn-sm btn-success" onclick="openPayoutPaid('restaurant','${h.id}','to_restaurant','')">Marcar pagada</button>`}
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  function renderHistory(history) {
    if (!history.length) {
      return '<div class="card p-3"><h6>Historial</h6><p class="small text-muted mb-0">Sin liquidaciones registradas.</p></div>';
    }
    const kindLabel = { restaurant: 'Restaurante', courier: 'Repartidor' };
    const statusLabel = { pending: 'Pendiente', paid: 'Pagada', confirmed: 'Confirmada', cancelled: 'Cancelada' };
    return `<div class="card p-3">
      <h6>Historial de liquidaciones</h6>
      <p class="small text-muted">Los cortes de repartidor muestran si el efectivo lo entrega el repartidor o si la plataforma se lo paga.</p>
      <div class="table-responsive"><table class="table table-sm align-middle">
        <thead><tr><th>Tipo</th><th>Nombre</th><th>Período</th><th class="text-end">Monto</th><th>Concepto</th><th>Estado</th><th></th></tr></thead>
        <tbody>${history.map(h => {
          const isCourier = h.kind === 'courier';
          const toPlatform = isCourier && h.direction === 'to_platform';
          const concept = !isCourier
            ? '<span class="badge bg-primary">Pago al negocio</span>'
            : (toPlatform
              ? '<span class="badge bg-warning text-dark">Repartidor entrega efectivo</span>'
              : '<span class="badge bg-info text-dark">Plataforma paga al repartidor</span>');
          const code = isCourier && h.confirmation_code
            ? `<div class="small text-muted mt-1">Código: <strong>${esc(h.confirmation_code)}</strong></div>`
            : '';
          let action = '';
          if (h.status === 'pending') {
            action = isCourier
              ? `<button class="btn btn-sm ${toPlatform ? 'btn-warning' : 'btn-success'}" onclick="openPayoutPaid('courier','${h.id}','${h.direction}','${esc(h.confirmation_code || '')}')">${toPlatform ? 'Recibí el efectivo' : 'Marcar pagada'}</button>`
              : `<button class="btn btn-sm btn-success" onclick="openPayoutPaid('restaurant','${h.id}','to_restaurant','')">Marcar pagada</button>`;
          }
          return `<tr>
            <td>${kindLabel[h.kind] || h.kind}</td>
            <td>${esc(h.name)}</td>
            <td class="small">${h.period_start} a ${h.period_end}</td>
            <td class="text-end fw-bold">${money(h.amount)}</td>
            <td>${concept}${code}</td>
            <td><span class="badge bg-${h.status === 'paid' || h.status === 'confirmed' ? 'success' : h.status === 'cancelled' ? 'secondary' : 'warning'}">${statusLabel[h.status] || h.status}</span></td>
            <td class="text-end">${action}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  function reconciliationShell(today) {
    const start = today ? today.slice(0, 8) + '01' : '';
    return `<div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h6 class="m-0"><i class="bi bi-calculator"></i> Conciliación por rango de fechas</h6>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <input type="date" class="form-control form-control-sm" id="reconStart" value="${start}" style="width:150px">
          <span class="text-muted">a</span>
          <input type="date" class="form-control form-control-sm" id="reconEnd" value="${today || ''}" style="width:150px">
          <button class="btn btn-sm btn-outline-primary" onclick="loadReconciliation()">
            <i class="bi bi-search"></i> Calcular
          </button>
        </div>
      </div>
      <div id="reconError" class="alert alert-danger d-none mt-2 mb-0"></div>
      <div id="reconResults" class="mt-3"><p class="text-muted small mb-0">Selecciona el rango y pulsa Calcular.</p></div>
    </div>`;
  }

  function renderReconciliation(data) {
    const t = data.totals || {};
    const netPlatform = parseFloat(t.commission || 0) + parseFloat(t.flat_fee || 0) - parseFloat(t.loyalty_discount || 0);
    return `
      <div class="row g-2 mb-3">
        ${summaryCard('Pedidos entregados', t.orders || 0)}
        ${summaryCard('Ventas', money(t.total))}
        ${summaryCard('Cuota por pedido', money(t.commission), 'border-success')}
        ${summaryCard('Cuota fija', money(t.flat_fee), 'border-success')}
        ${summaryCard('Puntos canjeados (los absorbe la plataforma)', money(t.loyalty_discount), parseFloat(t.loyalty_discount || 0) ? 'border-primary' : '')}

  function reservationActions(r) {
    const buttons = [];
    if (r.deposit_status === 'pending') {
      buttons.push(`<button class="btn btn-sm btn-success" onclick="resDepositAction('${r.id}','confirm')">Confirmar depósito</button>`);

    if ((r.deposit_status === 'paid' || r.deposit_status === 'retained') && r.deposit_settlement_status === 'pending') {
      buttons.push(`<button class="btn btn-sm btn-primary" onclick="resDepositAction('${r.id}','transfer')">Transferir al restaurante</button>`);

      buttons.push(`<button class="btn btn-sm btn-outline-success" onclick="settleReservationFee('${r.id}')">Cobrar ${money(r.restaurant_owes)}</button>`);

  async function loadPayouts() {
    const loading = document.getElementById('payoutsLoading');
    const content = document.getElementById('payoutsContent');
    const error = document.getElementById('payoutsError');
    error.classList.add('d-none');
    loading.classList.remove('d-none');
    loadReservationDeposits();
    loadMandadoPrepayments();
    loadMandadoAdvances();
    try {
      const [data, history, advances] = await Promise.all([getAdminPayouts(), getPayoutHistory(), getAdminAdvances()]);
      const restaurants = data.restaurants || [];
      const couriers = data.couriers || [];
      const pendingRestaurants = restaurants.reduce((s, r) => s + parseFloat(r.pending_amount || 0), 0);
      const businessDebt = restaurants.reduce(
        (s, r) => s + Math.max(-parseFloat(r.net_amount || 0), 0), 0
      );
      const pendingCouriers = couriers.reduce(
        (s, c) => s + Math.max(parseFloat(c.net_amount || 0), 0), 0
      );
      const courierDebt = couriers.reduce(
        (s, c) => s + Math.max(-parseFloat(c.net_amount || 0), 0), 0
      );
      const pendingTransfers = (data.pending_transfers || []).reduce((s, t) => s + parseFloat(t.amount || 0), 0);
      const pendingAdvances = (advances || []).filter(a => a.status === 'pending').reduce((s, a) => s + parseFloat(a.amount || 0), 0);
      const dueCount = [...restaurants, ...couriers].filter(x => x.status === 'due').length;

      content.innerHTML = `
        <div class="row g-2 mb-3">
          ${summaryCard('Plataforma debe a negocios', money(pendingRestaurants), pendingRestaurants ? 'border-success' : '')}
          ${summaryCard('Negocios deben a plataforma (neto)', money(businessDebt), businessDebt ? 'border-danger' : '')}
          ${summaryCard('Plataforma debe a repartidores', money(pendingCouriers))}
          ${summaryCard('Repartidores deben (neto)', money(courierDebt), courierDebt ? 'border-danger' : '')}
          ${summaryCard('Transferencias por confirmar', money(pendingTransfers), pendingTransfers ? 'border-warning' : '')}
          ${summaryCard('Avances por aprobar', money(pendingAdvances), pendingAdvances ? 'border-warning' : '')}
          ${summaryCard('Liquidaciones listas', dueCount, dueCount ? 'border-success' : '')}
          ${summaryCard('Hoy', data.today)}
        </div>
        ${reconciliationShell(data.today)}
        ${renderRestaurants(restaurants)}
        ${renderCouriers(couriers)}
        ${renderAdvances(advances)}
        ${renderTransfers(data.pending_transfers || [])}
        ${renderPendingPayouts(history)}
        ${renderHistory(history)}`;
      content.classList.remove('d-none');
      loadReconciliation();
    } catch (ex) {
      error.textContent = ex.message;
      error.classList.remove('d-none');
    } finally {
      loading.classList.add('d-none');
    }
  }

  let payoutToConfirm = null;
  let payoutPaidModal = null;

  function openPayoutPaid(kind, id, direction, code) {
    payoutToConfirm = { kind, id, direction, code };
    const isCourierCash = kind === 'courier' && direction === 'to_platform';
    document.getElementById('payoutPaidTitle').textContent = isCourierCash
      ? 'Recibir efectivo del repartidor'
      : (kind === 'courier' ? 'Confirmar pago al repartidor' : 'Confirmar pago al negocio');
    document.getElementById('payoutPaidSummary').textContent = isCourierCash
      ? 'Confirma que el repartidor ya te entregó el efectivo de su corte. Esta acción cierra la liquidación.'
      : (kind === 'courier'
        ? 'Confirma que ya le pagaste al repartidor. Esta acción cierra la liquidación.'
        : 'Confirma que ya entregaste el pago al negocio. Esta acción cierra la liquidación.');
    document.getElementById('payoutCodeBox').classList.toggle('d-none', !isCourierCash);
    document.getElementById('payoutCodeInput').value = '';
    document.getElementById('payoutPaidError').classList.add('d-none');
    const button = document.getElementById('payoutPaidBtn');
    button.className = 'btn btn-sm ' + (isCourierCash ? 'btn-warning' : 'btn-success');
    button.textContent = isCourierCash ? 'Sí, ya me lo entregó' : 'Sí, ya se pagó';
    button.disabled = false;
    payoutPaidModal = payoutPaidModal || new bootstrap.Modal(document.getElementById('payoutPaidModal'));
    payoutPaidModal.show();
  }

  async function confirmPayoutPaid() {
    if (!payoutToConfirm) return;
    const { kind, id, direction } = payoutToConfirm;
    const code = direction === 'to_platform'
      ? document.getElementById('payoutCodeInput').value.trim()
      : '';
    const error = document.getElementById('payoutPaidError');
    if (kind === 'courier' && direction === 'to_platform' && !code) {
      error.textContent = 'Escribe el código de 6 dígitos que muestra el repartidor.';
      error.classList.remove('d-none');
      return;
    }
    const button = document.getElementById('payoutPaidBtn');
    button.disabled = true;
    try {
      await markPayoutPaid(kind, id, code);
      payoutPaidModal.hide();
      payoutToConfirm = null;
      showToast(kind === 'courier' && direction === 'to_platform'
        ? 'Efectivo recibido. Corte del repartidor cerrado.'
        : 'Liquidación marcada como pagada');
      loadPayouts();
    } catch (ex) {
      error.textContent = ex.message;
      error.classList.remove('d-none');
      button.disabled = false;
    }
  }

  async function confirmTransfer(id) {
    if (!confirm('¿Confirmas que la transferencia llegó a la cuenta de la plataforma?')) return;
    try {
      await confirmTransferReceived(id);
      showToast('Transferencia confirmada');
      loadPayouts();
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  async function approveAdvanceUI(id, paysRestaurant) {
    const label = paysRestaurant
      ? '¿Entregar el efectivo para pagar directamente al restaurante?'
      : '¿Entregar el efectivo como préstamo al repartidor? Se descontará de su próximo pago.';
    if (!confirm(label)) return;
    try {
      await approveAdvance(id, paysRestaurant);
      showToast('Avance aprobado');
      loadPayouts();
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  async function rejectAdvanceUI(id) {
    if (!confirm('¿Rechazar esta solicitud de avance?')) return;
    try {
      await rejectAdvance(id);
      showToast('Avance rechazado');
      loadPayouts();
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  async function settleAdvanceUI(id) {
    if (!confirm('¿Marcar este avance como liquidado?')) return;
    try {
      await settleAdvance(id);
      showToast('Avance liquidado');
      loadPayouts();
    } catch (ex) { showToast(ex.message, 'danger'); }
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('is_superuser') === 'true') {
      loadPayouts();
      loadRefunds();
    }
  });
</script>
{% endblock %}
