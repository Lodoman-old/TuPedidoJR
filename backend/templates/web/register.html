{% extends "base.html" %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4">
      <div class="text-center mb-4">
        <img src="/static/logo.png" height="60" alt="TuPedidoJR">
        <h4 class="mt-2">Crear cuenta</h4>
      </div>
      <div id="regError" class="alert alert-danger d-none"></div>
      <form id="regForm">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" id="phone">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Código de referido (opcional)</label>
          <input type="text" class="form-control" id="referralCode" placeholder="Ej. A1B2C3D4" maxlength="20">
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
      </form>
      <div class="text-center mt-3">
        <a href="/web/login" id="loginLink">¿Ya tienes cuenta? Inicia sesión</a>
        <br><a href="/web/register-restaurant">Registrar mi restaurante</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const refParam = new URLSearchParams(window.location.search).get('ref');
  if (refParam) {
    const refInput = document.getElementById('referralCode');
    if (refInput) refInput.value = refParam.toUpperCase();
  }

  const nextParam = new URLSearchParams(window.location.search).get('next');
  const safeNext = nextParam && nextParam.startsWith('/web/') && !nextParam.startsWith('/web/login')
    ? nextParam
    : null;
  const loginTarget = safeNext ? `/web/login?next=${encodeURIComponent(safeNext)}` : '/web/login';
  const loginLink = document.getElementById('loginLink');
  if (loginLink) loginLink.href = loginTarget;

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const referralCode = document.getElementById('referralCode').value.trim();
    const errEl = document.getElementById('regError');
    errEl.classList.add('d-none');
    try {
      await register(name, email, password, phone || null, referralCode || null);
      showToast('Cuenta creada. Inicia sesión.');
      setTimeout(() => window.location.href = loginTarget, 1500);
    } catch (ex) {
      errEl.textContent = ex.message;
      errEl.classList.remove('d-none');
    }
  });
</script>
{% endblock %}
