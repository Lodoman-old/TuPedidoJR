{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4>Crear nueva contraseña</h4>
      <div id="resetMsg" class="alert d-none"></div>
      <form id="resetForm">
        <input id="newPassword" type="password" minlength="6" class="form-control mb-3" placeholder="Nueva contraseña" required>
        <input id="confirmPassword" type="password" minlength="6" class="form-control mb-3" placeholder="Confirmar contraseña" required>
        <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
      </form>
      <div class="text-center mt-3 small"><a href="/web/login">Volver a iniciar sesión</a></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('resetMsg');
    msg.className = 'alert d-none';
    const password = document.getElementById('newPassword').value;
    if (password !== document.getElementById('confirmPassword').value) {
      msg.className = 'alert alert-danger';
      msg.textContent = 'Las contraseñas no coinciden.';
      return;
    }
    try {
      const res = await apiRequest('POST', '/auth/reset-password', { token, password });
      msg.className = 'alert alert-success';
      msg.textContent = res.message;
      setTimeout(() => window.location.href = '/web/login', 1800);
    } catch (ex) {
      msg.className = 'alert alert-danger';
      msg.textContent = ex.message;
    }
  });
</script>
{% endblock %}
