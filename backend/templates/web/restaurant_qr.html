<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR de {{ restaurant.name }} | TuPedidoJR</title>
  <style>
    :root { --ink:#0d1b2a; --blue:#1B2F6B; --muted:#5d6b7a; --line:#e3e9f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#eef3f9; color:var(--ink); }
    .toolbar { display:flex; gap:10px; justify-content:center; align-items:center; padding:18px; flex-wrap:wrap; }
    .toolbar a, .toolbar button {
      font: inherit; border:0; border-radius:10px; padding:11px 18px; cursor:pointer;
      text-decoration:none; display:inline-flex; gap:8px; align-items:center;
    }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-light { background:#fff; color:var(--ink); border:1px solid #d7e0ea; }
    .sheet {
      width: 210mm; min-height: 297mm; margin: 0 auto 30px; background:#fff;
      padding: 22mm 18mm; display:flex; align-items:center; justify-content:center;
    }
    .card {
      width:100%; max-width:150mm; border:2px solid var(--line); border-radius:22px;
      padding:14mm 12mm; text-align:center; background:#fff;
    }
    .logo { height:20mm; max-width:62mm; object-fit:contain; margin-bottom:6mm; }
    h1 { font-size:26px; margin:0 0 2mm; color:var(--blue); }
    .tagline { color:var(--muted); font-size:14px; margin:0 0 8mm; }
    .qr { width:75mm; height:75mm; margin:0 auto 6mm; }
    .qr svg { width:100%; height:100%; display:block; }
    .scan { font-size:20px; font-weight:700; margin:0 0 2mm; }
    .url { font-size:12px; color:var(--muted); word-break:break-all; margin:0 0 2mm; }
    .print-hint { font-size:11px; color:var(--muted); margin:0 0 8mm; }
    .footer { border-top:1px solid var(--line); padding-top:5mm; font-size:12px; color:var(--muted); line-height:1.5; }
    .brand { font-weight:700; color:var(--blue); }
    @media print {
      @page { size: letter; margin: 0; }
      body { background:#fff; }
      .toolbar { display:none; }
      .sheet { width:auto; min-height:auto; margin:0; padding:14mm; }
      .card { border-color:#cfd8e3; }
    }
    @media (max-width: 820px) {
      .sheet { width:auto; min-height:auto; padding:10mm 6mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-primary" type="button" onclick="window.print()">
      Imprimir o guardar PDF
    </button>
    <a class="btn-light" href="/api/v1/restaurants/{{ restaurant.id }}/qr?format=png&download=1&v=2">Descargar PNG</a>
    <a class="btn-light" href="/api/v1/restaurants/{{ restaurant.id }}/qr?format=svg&download=1&v=2">Descargar SVG</a>
    <a class="btn-light" href="/web/restaurants/{{ restaurant.id }}/profile">Volver al panel</a>
  </div>

  <div class="sheet">
    <div class="card">
      <img class="logo" src="{{ restaurant.logo_url or '/static/logo.png' }}" alt="{{ restaurant.name }}" onerror="this.src='/static/logo.png'">
      <h1>{{ restaurant.name }}</h1>
      <p class="tagline">Pide en línea y recibe en casa</p>
      <div class="qr"><img src="/api/v1/restaurants/{{ restaurant.id }}/qr?format=png&scale=24" alt="QR de {{ restaurant.name }}" style="width:100%;height:100%;object-fit:contain"></div>
      <p class="scan">Escanea y pide aquí</p>
      <p class="url">{{ public_url }}</p>
      <p class="print-hint">Imprime al 100% para conservar el tamaño del QR.</p>
      <div class="footer">
        También puedes pedir desde la app <span class="brand">TuPedidoJR</span><br>
        Comida, tiendas, servicios y mandados en Juventino Rosas.
      </div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('print') === '1') {
      window.addEventListener('load', () => window.print());
    }
  </script>
</body>
</html>
