{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h5 class="mb-0" id="requestsTitle"><i class="bi bi-chat-square-text"></i> Solicitudes de producto</h5>
    <small class="text-muted" id="requestsSubtitle">Peticiones de clientes para productos que no están en el catálogo.</small>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-secondary" href="/web/restaurants/{{ restaurant_id }}">Volver al panel</a>
    <button class="btn btn-sm btn-outline-primary" onclick="loadRequests()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
  </div>
</div>
<div id="requestsError" class="alert alert-danger d-none"></div>
<div class="card p-2 mb-3">
  <div class="row g-2 align-items-center">
    <div class="col-12 col-md">
      <input id="requestsSearch" class="form-control form-control-sm" autocomplete="off"
             placeholder="Buscar cliente, teléfono o producto...">
    </div>
    <div class="col-7 col-md-auto">
      <select id="requestsStatus" class="form-select form-select-sm">
        <option value="">Todas</option>
        <option value="pending">Pendientes</option>
        <option value="quoted">Cotizadas</option>
        <option value="converted">Con pedido</option>
        <option value="rejected">Rechazadas</option>
        <option value="cancelled">Canceladas</option>
      </select>
    </div>
    <div class="col-5 col-md-auto">
      <button class="btn btn-sm btn-outline-secondary w-100" onclick="clearRequestFilters()">
        <i class="bi bi-x-circle"></i> Limpiar
      </button>
    </div>
  </div>
</div>
<div id="requestsLoading" class="text-center py-4"><div class="spinner-border text-primary"></div></div>
<div id="requestsList"></div>
<div id="requestsMore" class="text-center mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
  const RID = '{{ restaurant_id }}';
  const LABELS = {
    pending: ['Pendiente', 'warning text-dark'],
    quoted: ['Cotizada', 'info text-dark'],
    converted: ['Pedido creado', 'success'],
    rejected: ['Rechazada', 'danger'],
    cancelled: ['Cancelada', 'secondary'],
  };
  const money = n => money0(n);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function actions(request) {
    if (request.status !== 'pending') {
      return request.order_id
        ? `<a class="btn btn-sm btn-outline-success" href="/web/orders/${request.order_id}">Ver pedido</a>`
        : '';
    }
    return `<button class="btn btn-sm btn-success" onclick="quoteRequest('${request.id}')">Cotizar</button>
      <button class="btn btn-sm btn-outline-danger" onclick="rejectRequest('${request.id}')">Rechazar</button>`;
  }

  function card(request) {
    const [label, color] = LABELS[request.status] || [request.status, 'secondary'];
    const when = new Date(request.created_at).toLocaleString('es-MX', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
    });
    return `<div class="card p-3 mb-2">
      <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
        <div>
          <h6 class="mb-1">${esc(request.customer_name || 'Cliente')} <span class="badge bg-${color}">${label}</span></h6>
          <div class="small text-muted">${esc(when)} · ${request.quantity} pieza(s)</div>
          <div class="small text-muted"><i class="bi bi-telephone"></i> ${esc(request.customer_phone || 'Sin teléfono')}</div>
        </div>
        <div class="text-end small">
          ${request.budget != null ? `<div>Presupuesto: ${money(request.budget)}</div>` : ''}
          ${request.quoted_price != null ? `<div>Cotizado: <strong>${money(request.quoted_price)}</strong></div>` : ''}
        </div>
      </div>
      <p class="small mb-1 mt-2">${esc(request.description)}</p>
      ${request.notes ? `<div class="small text-muted">Nota del cliente: ${esc(request.notes)}</div>` : ''}
      ${request.reference_photo_url ? `<img src="${esc(request.reference_photo_url)}" class="document-thumb mt-2" alt="Foto de referencia" onclick="openDocumentPreview('${esc(request.reference_photo_url)}','Foto de referencia')">` : ''}
      ${request.store_notes ? `<div class="small text-muted">Respuesta: ${esc(request.store_notes)}</div>` : ''}
      <div class="small text-muted mt-2">Entrega: ${esc(request.delivery_address)}</div>
      <div class="mt-2 d-flex gap-2 flex-wrap">${actions(request)}</div>
    </div>`;
  }

  async function quoteRequest(id) {
    const raw = prompt('Precio del producto (solo el producto, sin envío):');
    if (raw === null) return;
    const price = Number(raw);
    if (!Number.isFinite(price) || price <= 0) {
      showToast('Escribe un precio válido', 'warning');
      return;
    }
    const notes = prompt('Nota para el cliente (opcional):') || null;
    try {
      await apiRequest('PATCH', `/restaurants/${RID}/requests/${id}/respond`, {
        status: 'quoted', quoted_price: price, store_notes: notes,
      });
      showToast('Cotización enviada');
      loadRequests();
    } catch (e) { showToast(e.message, 'danger'); }
  }

  async function rejectRequest(id) {
    const notes = prompt('Motivo del rechazo (opcional):');
    if (notes === null) return;
    try {
      await apiRequest('PATCH', `/restaurants/${RID}/requests/${id}/respond`, {
        status: 'rejected', store_notes: notes || null,
      });
      showToast('Solicitud rechazada');
      loadRequests();
    } catch (e) { showToast(e.message, 'danger'); }
  }

  let requestsAreStore = true;

  async function loadRequestsHeader() {
    try {
      const r = await getRestaurant(RID);
      requestsAreStore = Boolean(r.business_type && r.business_type !== 'restaurant');
      const title = document.getElementById('requestsTitle');
      const subtitle = document.getElementById('requestsSubtitle');
      if (requestsAreStore) {
        title.innerHTML = '<i class="bi bi-chat-square-text"></i> Solicitudes de producto';
        subtitle.textContent = 'Peticiones de clientes para productos que no están en el catálogo.';
      } else {
        title.innerHTML = '<i class="bi bi-stars"></i> Pedidos especiales';
        subtitle.textContent = 'Platillos o pedidos fuera del menú que el cliente solicita y el negocio cotiza.';
      }
    } catch (e) { /* se queda el texto por defecto */ }
  }

  const REQUESTS_PAGE_SIZE = 12;
  let requestsRows = [];
  let requestsOffset = 0;
  let requestsSearchTimer = null;

  function clearRequestFilters() {
    document.getElementById('requestsSearch').value = '';
    document.getElementById('requestsStatus').value = '';
    loadRequests(true);
  }

  function renderRequests() {
    const list = document.getElementById('requestsList');
    list.innerHTML = requestsRows.length
      ? requestsRows.map(card).join('')
      : `<div class="card p-4 text-center text-muted">${requestsAreStore ? 'No hay solicitudes que coincidan con la búsqueda.' : 'No hay pedidos especiales que coincidan con la búsqueda.'}</div>`;
    const more = document.getElementById('requestsMore');
    if (requestsRows.length && requestsRows.length % REQUESTS_PAGE_SIZE === 0) {
      more.innerHTML = '<button class="btn btn-sm btn-outline-primary" onclick="loadRequests(false)"><i class="bi bi-chevron-down"></i> Mostrar más</button>';
    } else {
      more.innerHTML = requestsRows.length
        ? '<span class="small text-muted">No hay más resultados.</span>'
        : '';
    }
  }

  async function loadRequests(reset = true) {
    const loading = document.getElementById('requestsLoading');
    const list = document.getElementById('requestsList');
    const search = document.getElementById('requestsSearch').value.trim();
    const status = document.getElementById('requestsStatus').value;
    if (reset) {
      requestsRows = [];
      requestsOffset = 0;
      loading.classList.remove('d-none');
      list.innerHTML = '';
    }
    try {
      const params = new URLSearchParams({
        limit: String(REQUESTS_PAGE_SIZE),
        offset: String(requestsOffset),
      });
      if (search) params.set('q', search);
      if (status) params.set('status_filter', status);
      const rows = await apiRequest('GET', `/restaurants/${RID}/requests?${params.toString()}`);
      requestsRows = reset ? rows : requestsRows.concat(rows);
      requestsOffset = requestsRows.length;
      renderRequests();
      document.getElementById('requestsError').classList.add('d-none');
    } catch (e) {
      const box = document.getElementById('requestsError');
      box.textContent = e.message; box.classList.remove('d-none');
    } finally {
      loading.classList.add('d-none');
    }
  }

  document.getElementById('requestsSearch').addEventListener('input', () => {
    clearTimeout(requestsSearchTimer);
    requestsSearchTimer = setTimeout(() => loadRequests(true), 350);
  });
  document.getElementById('requestsStatus').addEventListener('change', () => loadRequests(true));

  loadRequestsHeader();
  loadRequests(true);
  setInterval(() => {
    const hasFilters = document.getElementById('requestsSearch').value.trim()
      || document.getElementById('requestsStatus').value;
    if (!hasFilters && requestsOffset <= REQUESTS_PAGE_SIZE) loadRequests(true);
  }, 30000);
</script>
{% endblock %}
