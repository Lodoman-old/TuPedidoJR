{% extends "base.html" %}
{% block head_extra %}
<style>
  #tabRestaurants.active, #tabStores.active {
    background: #1B2F6B;
    border-color: #1B2F6B;
    color: #fff;
  }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
  <h4 class="m-0" id="pageTitle">Restaurantes</h4>
  <div class="d-flex gap-2">
    <a class="btn btn-sm btn-outline-primary" id="tabRestaurants" href="/web/restaurants">Restaurantes</a>
    <a class="btn btn-sm btn-outline-primary" id="tabStores" href="/web/restaurants?type=store">Tiendas</a>
  </div>
</div>
<div class="input-group mb-3">
  <input type="text" class="form-control" id="searchInput" autocomplete="off"
         placeholder="Buscar restaurante, giro o platillo (ej. sushi, taco, pizza)...">
  <button class="btn btn-outline-primary" id="searchBtn" aria-label="Buscar"><i class="bi bi-search"></i></button>
</div>
<div class="d-flex gap-3 flex-wrap align-items-center mb-3">
  <select id="filterSort" class="form-select form-select-sm" style="max-width:210px">
    <option value="">Más cercanos</option>
    <option value="rating">Mejor calificados</option>
    <option value="fee">Menor costo de envío</option>
  </select>
  <div class="form-check form-switch mb-0">
    <input class="form-check-input" type="checkbox" id="filterOpen">
    <label class="form-check-label small" for="filterOpen">Abiertos ahora</label>
  </div>
  <div class="form-check form-switch mb-0">
    <input class="form-check-input" type="checkbox" id="filterFree">
    <label class="form-check-label small" for="filterFree">Envío gratis</label>
  </div>
</div>
<div id="restaurantsList" class="row g-3"></div>
<div id="loadingSpinner" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>
<div id="emptyMsg" class="text-center py-5 d-none">
  <i class="bi bi-shop" style="font-size:3rem;color:#ccc;"></i>
  <p class="mt-2 text-muted" id="emptyText">No hay restaurantes cerca de tu ubicación</p>
  <button class="btn btn-outline-primary d-none" id="showAllBtn" onclick="loadAllRestaurants()">Ver todos los restaurantes</button>
</div>
{% endblock %}
{% block scripts %}
<script>
  const PAGE_TYPE = new URLSearchParams(window.location.search).get('type') === 'store' ? 'store' : 'restaurant';
  let searchTimer = null;

  function applyPageType() {
    const isStore = PAGE_TYPE === 'store';
    document.getElementById('pageTitle').textContent = isStore ? 'Tiendas' : 'Restaurantes';
    document.getElementById('searchInput').placeholder = isStore
      ? 'Buscar tienda, giro o producto...'
      : 'Buscar restaurante, giro o platillo (ej. sushi, taco, pizza)...';
    document.getElementById('tabRestaurants').classList.toggle('active', !isStore);
    document.getElementById('tabStores').classList.toggle('active', isStore);
    document.getElementById('emptyText').textContent = isStore
      ? 'No hay tiendas con esos filtros'
      : 'No hay restaurantes cerca de tu ubicación';
    document.getElementById('showAllBtn').textContent = isStore
      ? 'Ver todas las tiendas'
      : 'Ver todos los restaurantes';
  }

  function restaurantCard(r) {
    const cuisine = r.cuisine
      ? `<span class="badge bg-dark ms-1">${r.cuisine}</span>`
      : '';
    const openBadge = r.is_open_now === false
      ? '<span class="badge bg-secondary ms-1">Cerrado</span>'
      : '<span class="badge bg-success ms-1">Abierto</span>';
    const deliveryBadge = r.delivery_mode === 'own'
      ? '<span class="badge bg-info text-dark ms-1">Entrega propia</span>'
      : '';
    const distance = r.distance_m ? `${Math.round(r.distance_m)} m` : '';
    const estimated = r.estimated_delivery_fee != null ? Number(r.estimated_delivery_fee) : null;
    let deliveryText = '';
    if (r.delivery_mode === 'own') {
      if (estimated != null) {
        deliveryText = estimated > 0 ? `Envío $${estimated.toFixed(2)}` : 'Envío gratis';
      }
    } else if (estimated != null) {
      deliveryText = r.distance_m ? `Envío aprox. $${estimated.toFixed(2)}` : `Envío desde $${estimated.toFixed(2)}`;
    } else {
      deliveryText = 'Envío según distancia';
    }
    const meta = [deliveryText, distance].filter(Boolean).join(' · ');
    return `
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100" role="button" onclick="window.location='/web/restaurants/${r.id}'">
          <img src="${r.logo_url || '/static/logo.png'}" class="card-img-top" alt="${r.name}" onerror="this.src='/static/logo.png'">
          <div class="card-body">
            <h6 class="card-title mb-1">${r.name}</h6>
            <div class="mb-1">
              <span class="badge bg-warning text-dark">${r.rating || '0.0'}</span>
              ${cuisine}
              ${openBadge}
              ${deliveryBadge}
            </div>
            <small class="text-muted">${meta}</small>
          </div>
        </div>
      </div>`;
  }

  function renderRestaurants(data) {
    const container = document.getElementById('restaurantsList');
    const empty = document.getElementById('emptyMsg');
    const showAll = document.getElementById('showAllBtn');
    container.innerHTML = '';
    if (!data.length) {
      empty.classList.remove('d-none');
      return;
    }
    empty.classList.add('d-none');
    container.innerHTML = data.map(restaurantCard).join('');
  }

  function getFilters() {
    const filters = { business_type: PAGE_TYPE };
    const sort = document.getElementById('filterSort')?.value;
    if (sort) filters.sort = sort;
    if (document.getElementById('filterOpen')?.checked) filters.open_now = 'true';
    if (document.getElementById('filterFree')?.checked) filters.free_delivery = 'true';
    return filters;
  }

  const COORDS_KEY = 'tupedidojr_coords_v1';
  const COORDS_TTL_MS = 30 * 60 * 1000;
  let loadSeq = 0;

  function readCachedCoords() {
    try {
      const raw = localStorage.getItem(COORDS_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || Date.now() - Number(data.ts || 0) > COORDS_TTL_MS) return null;
      const lat = Number(data.lat);
      const lng = Number(data.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      return { lat, lng };
    } catch (e) {
      return null;
    }
  }

  function saveCoords(coords) {
    try {
      localStorage.setItem(COORDS_KEY, JSON.stringify({
        lat: coords.lat,
        lng: coords.lng,
        ts: Date.now(),
      }));
    } catch (e) { /* almacenamiento no disponible */ }
  }

  async function loadRestaurants(q) {
    const container = document.getElementById('restaurantsList');
    const spinner = document.getElementById('loadingSpinner');
    const empty = document.getElementById('emptyMsg');
    const emptyText = document.getElementById('emptyText');
    const showAll = document.getElementById('showAllBtn');
    const query = (q || '').trim();
    const filters = getFilters();
    const seq = ++loadSeq;

    container.innerHTML = '';
    empty.classList.add('d-none');
    spinner.classList.remove('d-none');
    try {
      let data;
      if (query) {
        // Global search: name, giro, description, dishes or categories.
        data = await listRestaurants(null, null, query, filters);
        if (seq !== loadSeq) return;
        emptyText.textContent = `No encontramos restaurantes para “${query}”`;
        showAll.classList.add('d-none');
        spinner.classList.add('d-none');
        renderRestaurants(data);
        if (!data.length) empty.classList.remove('d-none');
        return;
      }

      // Primera pintura: usa la ubicación guardada o muestra la lista sin
      // esperar al GPS. Así el listado aparece en menos de un segundo.
      const cached = readCachedCoords();
      data = await listRestaurants(
        cached ? cached.lat : null,
        cached ? cached.lng : null,
        null,
        filters,
      );
      if (seq !== loadSeq) return;
      emptyText.textContent = 'No hay restaurantes con esos filtros';
      showAll.classList.toggle('d-none', data.length > 0);
      spinner.classList.add('d-none');
      renderRestaurants(data);
      if (!data.length) empty.classList.remove('d-none');

      // Refinado en segundo plano: si el GPS entrega una ubicación distinta,
      // actualiza distancias y envío estimado sin bloquear la pantalla.
      refineLocation(seq, cached, filters);
    } catch (ex) {
      if (seq !== loadSeq) return;
      spinner.classList.add('d-none');
      showToast(ex.message, 'danger');
    }
  }

  async function refineLocation(seq, cached, filters) {
    const coords = await getCoords();
    if (!coords || seq !== loadSeq) return;
    const moved = !cached
      || Math.abs(coords.lat - cached.lat) > 0.001
      || Math.abs(coords.lng - cached.lng) > 0.001;
    if (!moved) return;
    saveCoords(coords);
    try {
      const data = await listRestaurants(coords.lat, coords.lng, null, filters);
      if (seq !== loadSeq) return;
      renderRestaurants(data);
      document.getElementById('emptyMsg')?.classList.toggle('d-none', data.length > 0);
    } catch (e) {
      // Si falla el refinado, se conserva la lista que ya está en pantalla.
    }
  }

  function getCoords() {
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
        () => resolve(null),
        { timeout: 4000, maximumAge: 600000 },
      );
    });
  }

  async function loadAllRestaurants() {
    const q = document.getElementById('searchInput').value.trim();
    await loadRestaurants(q);
  }

  function scheduleSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      loadRestaurants(document.getElementById('searchInput').value);
    }, 280);
  }

  document.getElementById('searchBtn').addEventListener('click', () => {
    clearTimeout(searchTimer);
    loadRestaurants(document.getElementById('searchInput').value);
  });
  document.getElementById('searchInput').addEventListener('input', scheduleSearch);
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(searchTimer);
      loadRestaurants(document.getElementById('searchInput').value);
    }
  });
  document.getElementById('filterSort').addEventListener('change', () => loadRestaurants(document.getElementById('searchInput').value));
  document.getElementById('filterOpen').addEventListener('change', () => loadRestaurants(document.getElementById('searchInput').value));
  document.getElementById('filterFree').addEventListener('change', () => loadRestaurants(document.getElementById('searchInput').value));
  applyPageType();
  loadRestaurants();
</script>
{% endblock %}
