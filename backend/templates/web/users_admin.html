{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h4 class="m-0"><i class="bi bi-people"></i> Usuarios registrados</h4>
    <small class="text-muted">Negocios, repartidores y clientes de TuPedidoJR.</small>
  </div>
  <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()">
    <i class="bi bi-arrow-clockwise"></i> Actualizar
  </button>
</div>

<div class="row g-2 mb-3" id="userSummary"></div>

<div class="card p-3 mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-4">
      <label class="form-label small mb-1" for="userSearch">Buscar</label>
      <input class="form-control form-control-sm" id="userSearch" placeholder="Nombre, correo o teléfono" oninput="onSearchInput()">
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small mb-1" for="userRole">Tipo de cuenta</label>
      <select class="form-select form-select-sm" id="userRole" onchange="applyFilters()">
        <option value="all">Todos</option>
        <option value="cliente">Clientes</option>
        <option value="negocio">Negocios</option>
        <option value="repartidor">Repartidores</option>
        <option value="admin">Administradores</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <label class="form-label small mb-1" for="userStatus">Estado</label>
      <select class="form-select form-select-sm" id="userStatus" onchange="applyFilters()">
        <option value="all">Todos</option>
        <option value="active">Activos</option>
        <option value="inactive">Inactivos</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <label class="form-label small mb-1" for="userPageSize">Por página</label>
      <select class="form-select form-select-sm" id="userPageSize" onchange="changePageSize()">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
      </select>
    </div>
    <div class="col-6 col-md-1 text-md-end">
      <span class="small text-muted" id="listSummary"></span>
    </div>
  </div>
</div>

<div id="usersError" class="alert alert-danger d-none"></div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Usuario</th>
          <th>Tipo</th>
          <th class="d-none d-lg-table-cell">Negocio</th>
          <th class="d-none d-md-table-cell">Contacto</th>
          <th class="d-none d-lg-table-cell">Registro</th>
          <th class="d-none d-md-table-cell text-end">Pedidos</th>
          <th>Estado</th>
          <th class="text-end">Ver</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center p-2 flex-wrap gap-2 border-top">
    <small class="text-muted" id="pageInfo"></small>
    <nav>
      <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
    </nav>
  </div>
</div>

<div class="modal fade" id="userDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-vcard"></i> Datos del usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="userDetailBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const state = { q: '', role: 'all', status: 'all', page: 1, pageSize: 25 };
  let rowsById = {};
  let searchTimer = null;

  const typeLabels = {
    restaurant: 'Restaurante', store: 'Tienda', grocery: 'Abarrotes',
    pharmacy: 'Farmacia', hardware: 'Ferretería', other: 'Otro',
  };
  const roleMeta = {
    cliente: { label: 'Cliente', css: 'bg-secondary' },
    negocio: { label: 'Negocio', css: 'bg-primary' },
    repartidor: { label: 'Repartidor', css: 'bg-success' },
    admin: { label: 'Admin', css: 'bg-dark' },
  };

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function fmtDate(value) {
    if (!value) return '—';
    try {
      return new Date(value).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
    } catch (e) { return '—'; }
  }
  function badges(roles) {
    return (roles || []).map(r => {
      const meta = roleMeta[r] || { label: r, css: 'bg-secondary' };
      return `<span class="badge ${meta.css}">${meta.label}</span>`;
    }).join(' ');
  }
  function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.q = document.getElementById('userSearch').value.trim();
      state.page = 1;
      loadUsers();
    }, 300);
  }
  function applyFilters() {
    state.role = document.getElementById('userRole').value;
    state.status = document.getElementById('userStatus').value;
    state.page = 1;
    loadUsers();
  }
  function changePageSize() {
    state.pageSize = Number(document.getElementById('userPageSize').value);
    state.page = 1;
    loadUsers();
  }

  function summaryCard(label, value, css) {
    return `<div class="col-6 col-lg-3"><div class="card p-3 text-center h-100">
      <small class="text-muted">${label}</small>
      <strong class="fs-4 ${css || ''}">${value}</strong>
    </div></div>`;
  }

  async function loadUsers() {
    const error = document.getElementById('usersError');
    const tbody = document.getElementById('usersTableBody');
    error.classList.add('d-none');
    try {
      const params = new URLSearchParams({
        role: state.role, status: state.status, page: state.page, page_size: state.pageSize,
      });
      if (state.q) params.set('q', state.q);
      const data = await apiRequest('GET', `/admin/users?${params}`);
      const s = data.summary || {};
      document.getElementById('userSummary').innerHTML =
        summaryCard('Total', s.total ?? 0) +
        summaryCard('Clientes', s.clients ?? 0) +
        summaryCard('Negocios', s.businesses ?? 0) +
        summaryCard('Repartidores', s.couriers ?? 0);

      rowsById = {};
      (data.items || []).forEach(row => { rowsById[row.id] = row; });

      if (!(data.items || []).length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Sin usuarios con estos filtros.</td></tr>';
      } else {
        tbody.innerHTML = data.items.map(row => {
          const business = (row.businesses || [])[0];
          return `<tr>
            <td>
              <strong>${esc(row.name)}</strong>
              <div class="small text-muted text-break">${esc(row.email)}</div>
            </td>
            <td>${badges(row.roles)}</td>
            <td class="d-none d-lg-table-cell">${business ? esc(business.name) : '—'}</td>
            <td class="d-none d-md-table-cell">${esc(row.phone || '—')}</td>
            <td class="d-none d-lg-table-cell">${fmtDate(row.created_at)}</td>
            <td class="d-none d-md-table-cell text-end">${row.orders_count || 0}</td>
            <td>${row.is_active
              ? '<span class="badge bg-success">Activo</span>'
              : '<span class="badge bg-secondary">Inactivo</span>'}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary" onclick="showUser('${row.id}')">
                <i class="bi bi-eye"></i>
              </button>
            </td>
          </tr>`;
        }).join('');
      }

      const from = data.total ? ((data.page - 1) * data.page_size) + 1 : 0;
      const to = Math.min(data.page * data.page_size, data.total);
      document.getElementById('listSummary').textContent = `${data.total}`;
      document.getElementById('pageInfo').textContent = `${from}–${to} de ${data.total}`;
      renderPagination(data);
    } catch (ex) {
      error.textContent = ex.message || 'No se pudieron cargar los usuarios.';
      error.classList.remove('d-none');
      tbody.innerHTML = '';
    }
  }

  function renderPagination(data) {
    const pages = Math.max(1, Math.ceil(data.total / data.page_size));
    const current = data.page;
    const nav = document.getElementById('pagination');
    const items = [];
    items.push(`<li class="page-item ${current <= 1 ? 'disabled' : ''}">
      <button class="page-link" onclick="goPage(${current - 1})">‹</button></li>`);
    const start = Math.max(1, current - 2);
    const end = Math.min(pages, start + 4);
    for (let p = start; p <= end; p += 1) {
      items.push(`<li class="page-item ${p === current ? 'active' : ''}">
        <button class="page-link" onclick="goPage(${p})">${p}</button></li>`);
    }
    items.push(`<li class="page-item ${current >= pages ? 'disabled' : ''}">
      <button class="page-link" onclick="goPage(${current + 1})">›</button></li>`);
    nav.innerHTML = items.join('');
  }

  function goPage(page) {
    state.page = page;
    loadUsers();
  }

  function showUser(id) {
    const row = rowsById[id];
    if (!row) return;
    const business = (row.businesses || []).map(b => `
      <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
        <div>
          <strong>${esc(b.name)}</strong>
          <div class="small text-muted">${typeLabels[b.business_type] || esc(b.business_type)} · ${esc(b.role)}</div>
        </div>
        <a class="btn btn-sm btn-outline-secondary" href="/web/restaurants/${b.id}" target="_blank">Abrir</a>
      </div>`).join('') || '<p class="text-muted small mb-0">Sin negocio asociado.</p>';
    const courier = row.courier ? `
      <div class="row g-2 small">
        <div class="col-6"><span class="text-muted">Vehículo:</span> ${esc(row.courier.vehicle_type || '—')}</div>
        <div class="col-6"><span class="text-muted">Disponible:</span> ${row.courier.is_available ? 'Sí' : 'No'}</div>
        <div class="col-6"><span class="text-muted">Entregas:</span> ${row.courier.total_deliveries}</div>
        <div class="col-6"><span class="text-muted">Calificación:</span> ${row.courier.rating.toFixed(1)}</div>
      </div>` : '<p class="text-muted small mb-0">No es repartidor.</p>';

    document.getElementById('userDetailBody').innerHTML = `
      <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
        <div>
          <h5 class="mb-1">${esc(row.name)}</h5>
          <div class="text-muted small text-break">${esc(row.email)}</div>
        </div>
        <div>${badges(row.roles)} ${row.is_active ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>'}</div>
      </div>
      <div class="row g-2 small mb-3">
        <div class="col-12 col-md-6"><span class="text-muted">Teléfono:</span> ${esc(row.phone || '—')}</div>
        <div class="col-12 col-md-6"><span class="text-muted">Registro:</span> ${fmtDate(row.created_at)}</div>
        <div class="col-12"><span class="text-muted">Dirección:</span> ${esc(row.address || '—')}</div>
        <div class="col-6"><span class="text-muted">Pedidos:</span> ${row.orders_count || 0}</div>
        <div class="col-6"><span class="text-muted">Último pedido:</span> ${fmtDate(row.last_order_at)}</div>
        <div class="col-6"><span class="text-muted">Puntos:</span> ${row.loyalty_points || 0}</div>
        <div class="col-6"><span class="text-muted">Cliente de confianza:</span> ${row.trusted_customer ? 'Sí' : 'No'}</div>
      </div>
      <h6 class="mt-3">Negocios</h6>
      ${business}
      <h6 class="mt-3">Repartidor</h6>
      ${courier}`;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('userDetailModal')).show();
  }

  document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
