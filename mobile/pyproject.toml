[project]
name = "tupedidojr"
version = "1.0.22"
description = "TuPedidoJR mobile app (Flet)"
requires-python = ">=3.11"
dependencies = [
    "flet==1.1.2",
    "flet-local-auth==1.1.2",
    "flet-secure-storage==1.1.2",
    "httpx>=0.28.0",
    "websockets>=12.0",
]

[tool.flet]
product = "TuPedidoJR"
org = "com.tupedidojr"
company = "TuPedidoJR"
build_version = "1.0.22"
build_number = 22
permissions = ["biometric"]

[tool.flet.app]
module = "main"
